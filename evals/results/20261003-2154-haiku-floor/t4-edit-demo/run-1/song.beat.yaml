beat: 0.1

meta:
  title: Demo Riff
  tempo: 126
  time: 4/4
  key: E minor
  style: hard rock

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }
  org: { type: organ }

patterns:
  beat_verse:
    type: drums
    bars: 1
    grid: |
      hh: x-x-x-x-x-x-x-x-
      sd: ----X--g----X-g-
      bd: x-------x-x-----
  beat_chorus:
    type: drums
    bars: 1
    grid: |
      cr: X---------------
      rd: --x-x-x-x-x-x-x-
      sd: ----X-------X---
      bd: x-x-----x-x-----
  fill:
    type: drums
    bars: 1
    grid: |
      hh: x-x-x-x---------
      sd: ----X---xx------
      t1: ----------xx----
      t2: ------------xx--
      t3: --------------xX
      bd: x-------x-------
  riff:
    type: pitched
    bars: 2
    notes: "E2:8!pm E2!pm G2 E2!pm A2 E2!pm Bb2 A2 | (E2:8!pm)*4 [D3 A3]:4 [E3 B3]:4"
  bass_riff:
    type: pitched
    bars: 2
    notes: "(E1:8)*8 | (E1:8)*6 D2:8 E2:8"

sections:
  intro:
    bars: 4
    chords: "E5 | E5 | E5 | E5"
    parts:
      gt1: { use: riff }
      bs:
        use: bass_riff
        replace: { 1-2: { notes: "r:1 | r:1" } }
      dr:
        use: beat_verse
        replace:
          1-2: { grid: "hh: x---x---x---x--- | x---x---x---x---" }
          4: { use: fill }

  verse:
    bars: 8
    chords: "E5 | E5 | E5 | E5 | C5 | D5 | E5 | B5"
    parts:
      gt1:
        use: riff
        replace:
          5-8: { notes: "([C3 G3]:8!pm)*8 | ([D3 A3]:8!pm)*8 | (E2:8!pm)*8 | ([B2 F#3]:8!pm)*6 [B2 F#3 B3]:4" }
      bs:
        use: bass_riff
        replace:
          5-8: { notes: "(C2:8)*8 | (D2:8)*8 | (E1:8)*8 | (B1:8)*8" }
      org:
        dynamic: mp
        notes: "[E3 B3 E4]:1 | % | % | % | [C3 G3 C4]:1 | [D3 A3 D4]:1 | [E3 B3 E4]:1 | [B2 F#3 B3]:1"
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }

  chorus:
    bars: 8
    dynamic: f
    chords: "C | G | D | Em | C | G | D | B"
    parts:
      gt1:
        notes: >-
          [C3 G3 C4]:4. [C3 G3 C4]:8~ [C3 G3 C4]:2 |
          [G2 D3 G3]:4. [G2 D3 G3]:8~ [G2 D3 G3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8~ [E2 B2 E3]:2 |
          [C3 G3 C4]:4. [C3 G3 C4]:8~ [C3 G3 C4]:2 |
          [G2 D3 G3]:4. [G2 D3 G3]:8~ [G2 D3 G3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [B2 F#3 B3]:4. [B2 F#3 B3]:8~ [B2 F#3 B3]:2
      gt2:
        notes: >-
          G4:4. E4:8 D4:4 E4:4 | D4:2. B3:4 | A3:4 D4:8 E4:8 F#4:4 A4:4 | G4:2~ G4:4!vib r:4 |
          G4:4. E4:8 D4:4 E4:4 | D4:2 B3:4 D4:4 | A4:4. G4:8 F#4:4 D4:4 | D#4:2 F#4:2
      bs:
        notes: "(C2:8)*8 | (G1:8)*8 | (D2:8)*8 | (E1:8)*8 | (C2:8)*8 | (G1:8)*8 | (D2:8)*8 | (B1:8)*6 A1:8 G1:8"
      org:
        notes: >-
          [C4 E4 G4]:1 | [B3 D4 G4]:1 | [A3 D4 F#4]:1 | [B3 E4 G4]:1 |
          [C4 E4 G4]:1 | [B3 D4 G4]:1 | [A3 D4 F#4]:1 | [B3 D#4 F#4]:1
      dr:
        use: beat_chorus
        replace: { 8: { use: fill } }

  bridge:
    bars: 4
    chords: "Am | C | D | B"
    parts:
      dr:
        grid: |
          bd: x--------------- | x--------------- | x--------------- | x---------------
          sd: --------X------- | --------X------- | --------X------- | --------X-------
      bs:
        notes: "A1:1 | C2:1 | D2:1 | B1:1"
      gt1:
        notes: "[A3 E4]:1 | [C3 G3]:1 | [D3 A3]:1 | [B2 F#3]:1"
      org:
        notes: "[A2 C3 E3]:1 | [C3 G3 C4]:1 | [D3 A3 D4]:1 | [B2 F#3 B3]:1"
      gt2:
        notes: "r:1 | r:1 | r:1 | r:1"

  outro:
    bars: 2
    dynamic: f
    chords: "Em | Em"
    parts:
      gt1: { notes: "[E2 B2 E3 G3 B3 E4]:1~ | [E2 B2 E3 G3 B3 E4]:1" }
      bs: { notes: "E1:1~ | E1:1" }
      org: { notes: "[E3 G3 B3 E4]:1~ | [E3 G3 B3 E4]:1" }
      dr:
        grid: |
          cr: X--------------- | ----------------
          bd: X--------------- | ----------------

form: [intro, verse, chorus, verse, chorus, bridge, outro]

performance:
  seed: 7
  humanize: { timing_ms: 5, velocity: 0.04 }
  parts:
    dr:
      lanes:
        sd: { offset_ms: 16 }
        hh: { velocity: -0.05 }
    bs: { offset_ms: 3 }
  edits:
    - { part: gt2, section: chorus, instance: 2, bar: 8, beat: 3, pitch: F#4, velocity: "+0.1" }

mix:
  dr:  { gain_db: 0 }
  bs:  { gain_db: -1 }
  gt1: { gain_db: -2, pan: -0.35 }
  gt2: { gain_db: -3, pan: 0.35 }
  org: { gain_db: -6, pan: 0.15 }
