beat: 0.1

meta:
  title: Untitled Riff
  tempo: 104
  time: 4/4
  key: A minor
  style: rock

instruments:
  dr: { type: drums }
  bs: { type: bass }
  gt: { type: guitar, tone: crunch }

patterns:
  drv_steady:
    type: drums
    bars: 1
    grid: |
      hh: x-x-x-x-x-x-x-x-
      sd: ----X-------X---
      bd: x-----x-x-------

  drv_fill:
    type: drums
    bars: 1
    grid: |
      hh: x-x-x-x---------
      sd: ----X---xxxx----
      bd: x-------x-------
      t2: ------------xx--
      t3: --------------xX

  drv_ride:
    type: drums
    bars: 1
    grid: |
      bd: x-x-----x-x-----
      sd: ----X-------X---
      rd: x-x-x-x-x-x-x-x-

  drv_ride_crash:
    type: drums
    bars: 1
    grid: |
      bd: x-x-----x-x-----
      sd: ----X-------X---
      rd: --x-x-x-x-x-x-x-
      cr: X---------------

  drv_hit:
    type: drums
    bars: 1
    grid: |
      bd: X---------------
      cr: X---------------

