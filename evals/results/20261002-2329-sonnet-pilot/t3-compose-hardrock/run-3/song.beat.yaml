beat: 0.1

meta:
  title: Voltage Road
  tempo: 128
  time: 4/4
  key: A major
  style: hard rock

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    grid: |
      hh: x-x-x-x-x-x-x-x-
      sd: ----X-------X---
      bd: x-------x-x-----
  beat_chorus:
    type: drums
    bars: 1
    grid: |
      cr: X---------------
      rd: x-x-x-x-x-x-x-x-
      sd: ----X-------X---
      bd: x-x-----x-x-----
  fill:
    type: drums
    bars: 1
    grid: |
      hh: x-x-x-----------
      sd: ----x-xx--------
      t1: --------xx------
      t2: ----------xx----
      t3: ------------xX--
      bd: x---------------
  ending:
    type: drums
    bars: 1
    grid: |
      cr: X---------------
      bd: X---------------
  riff_A:
    type: pitched
    bars: 2
    notes: "A2:8!pm A2!pm C#3 A2!pm D3 A2!pm E3 D3 | (A2:8!pm)*4 [D3 A3]:4 [E3 B3]:4"
  riff_D:
    type: pitched
    bars: 2
    notes: "D3:8!pm D3!pm F#3 D3!pm G3 D3!pm A3 G3 | (D3:8!pm)*4 [G3 D4]:4 [A3 E4]:4"
  riff_E:
    type: pitched
    bars: 2
    notes: "E3:8!pm E3!pm G#3 E3!pm A3 E3!pm B3 A3 | (E3:8!pm)*4 [A3 E4]:4 [B3 F#4]:4"
  bass_A:
    type: pitched
    bars: 2
    notes: "(A1:8)*8 | (A1:8)*8"
  bass_D:
    type: pitched
    bars: 2
    notes: "(D2:8)*8 | (D2:8)*8"
  bass_E:
    type: pitched
    bars: 2
    notes: "(E1:8)*8 | (E1:8)*8"

sections:
  intro:
    bars: 4
    dynamic: mf
    chords: "A5 | A5 | A5 | A5"
    parts:
      gt1: { use: riff_A }
      bs: { use: bass_A }
      dr: { use: beat_verse }

  verse:
    bars: 8
    dynamic: mf
    chords: "A5 | A5 | D5 | D5 | A5 | A5 | E5 | E5"
    parts:
      gt1:
        use: riff_A
        replace:
          3-4: { use: riff_D }
          7-8: { use: riff_E }
      bs:
        use: bass_A
        replace:
          3-4: { use: bass_D }
          7-8: { use: bass_E }
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }

  chorus:
    bars: 8
    dynamic: f
    chords: "A5 | D5 | E5 | A5 | A5 | D5 | E5 | A5"
    parts:
      gt1:
        notes: >-
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8~ [E2 B2 E3]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8~ [E2 B2 E3]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2
      gt2:
        notes: >-
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8~ [E2 B2 E3]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8~ [E2 B2 E3]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2
      bs:
        notes: "(A1:8)*8 | (D2:8)*8 | (E1:8)*8 | (A1:8)*8 | (A1:8)*8 | (D2:8)*8 | (E1:8)*8 | (A1:8)*8"
      dr:
        use: beat_chorus
        replace: { 8: { use: fill } }

  verse2:
    bars: 4
    dynamic: f
    chords: "A5 | A5 | E5 | E5"
    parts:
      gt1:
        use: riff_A
        replace: { 3-4: { use: riff_E } }
      bs:
        use: bass_A
        replace: { 3-4: { use: bass_E } }
      dr:
        use: beat_verse
        replace: { 4: { use: fill } }

  chorus2:
    extends: chorus
    parts:
      gt2:
        notes: >-
          A4:8 C#5:8 E5:4 D5:8 C#5:8 A4:4 |
          D5:8 F#5:8 A5:4 F#5:8 D5:8 A4:4 |
          E5:8 G#5:8 B5:4 A5:8 G#5:8 E5:4 |
          A5:2 E5:4 C#5:4 |
          E5:8 D5:8 C#5:4 A4:8 C#5:8 E5:4 |
          F#5:8 E5:8 D5:4 A4:8 D5:8 F#5:4 |
          G#5:8 A5:8 B5:4 G#5:8 E5:8 B4:4 |
          A5:1!vib
      dr:
        use: beat_chorus
        replace: { 8: { use: ending } }

form: [intro, verse, chorus, verse2, chorus2]

performance:
  seed: 11
  humanize: { timing_ms: 5, velocity: 0.04 }
  swing: { amount: 0.5, grid: 8 }
  parts:
    dr:
      lanes:
        sd: { offset_ms: 6 }
        hh: { velocity: -0.05 }
    bs: { offset_ms: 3 }
    gt1: { strum_ms: 8 }

mix:
  dr:  { gain_db: 0 }
  bs:  { gain_db: -1 }
  gt1: { gain_db: -2, pan: -0.35 }
  gt2: { gain_db: -2, pan: 0.35 }
