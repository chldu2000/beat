beat: 0.1

meta:
  title: Overdrive Highway
  tempo: 128
  time: 4/4
  key: A major
  style: hard rock

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    grid: |
      hh: x-x-x-x-x-x-x-x-
      sd: ----X-------X---
      bd: x-------x-x-----

  beat_chorus:
    type: drums
    bars: 1
    grid: |
      hh: x-x-x-x-x-x-x-x-
      sd: ----X-------X---
      bd: x-x-----x-x-----

  fill:
    type: drums
    bars: 1
    grid: |
      hh: x-x-x-x---------
      sd: ----X---x-x-x---
      t1: ------------x---
      t2: --------------x-
      t3: ---------------X
      bd: x-------x-------

  riff_a:
    type: pitched
    bars: 2
    notes: "A2:8!pm A2!pm C#3 A2!pm D3 A2!pm E3 D3 | (A2:8!pm)*4 [E3 A3]:4 [D3 A3]:4"

  bass_riff:
    type: pitched
    bars: 2
    notes: "(A1:8)*8 | (A1:8)*6 D2:8 E2:8"

sections:
  intro:
    bars: 4
    dynamic: f
    chords: "A5 | A5 | D5 | E5"
    parts:
      gt1:
        use: riff_a
        replace:
          3: { notes: "([D3 A3]:8!pm)*8" }
          4: { notes: "([E3 B3]:8!pm)*6 [E3 B3]:4" }
      bs:
        use: bass_riff
        replace:
          3: { notes: "(D2:8)*8" }
          4: { notes: "(E1:8)*8" }
      dr:
        use: beat_verse
        replace:
          1-2: { grid: "hh: x---x---x---x--- | x---x---x---x---" }

  verse:
    bars: 8
    chords: "A5 | A5 | A5 | A5 | D5 | D5 | E5 | E5"
    parts:
      gt1:
        use: riff_a
        replace:
          5-6: { notes: "([D3 A3]:8!pm)*8 | ([D3 A3]:8!pm)*8" }
          7-8: { notes: "([E3 B3]:8!pm)*8 | ([E3 B3]:8!pm)*6 [E3 B3]:4" }
      bs:
        use: bass_riff
        replace:
          5-6: { notes: "(D2:8)*8 | (D2:8)*8" }
          7-8: { notes: "(E1:8)*8 | (E1:8)*8" }
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }

  chorus:
    bars: 8
    dynamic: f
    chords: "D5 | D5 | A5 | A5 | E5 | E5 | D5 | E5"
    parts:
      gt1:
        notes: >-
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8~ [E2 B2 E3]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8~ [E2 B2 E3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8~ [E2 B2 E3]:2
      gt2:
        notes: >-
          A4:2 r:2 | r:1 | E4:2 r:2 | r:1 |
          B4:2 r:2 | r:1 | A4:2 r:2 | r:1
      bs:
        notes: "(D2:8)*8 | (D2:8)*8 | (A1:8)*8 | (A1:8)*8 | (E1:8)*8 | (E1:8)*8 | (D2:8)*8 | (E1:8)*8"
      dr:
        use: beat_chorus
        replace:
          1: { grid: "cr: X---------------\nhh: x-x-x-x-x-x-x-x-\nsd: ----X-------X---\nbd: x-x-----x-x-----" }
          8: { use: fill }

  verse2:
    bars: 4
    chords: "A5 | A5 | D5 | E5"
    parts:
      gt1:
        use: riff_a
        replace:
          3: { notes: "([D3 A3]:8!pm)*8" }
          4: { notes: "([E3 B3]:8!pm)*6 [E3 B3]:4" }
      bs:
        use: bass_riff
        replace:
          3: { notes: "(D2:8)*8" }
          4: { notes: "(E1:8)*8" }
      dr:
        use: beat_verse
        replace: { 4: { use: fill } }

  chorus2:
    extends: chorus
    parts:
      gt2:
        notes: >-
          D4:8 F#4:8 A4:4 F#4:8 D4:8 A3:4 |
          D4:8!h F#4:8 A4:8 D5:8 A4:4 F#4:4!vib |
          A4:8 C#5:8 E5:4 C#5:8 A4:8 E4:4 |
          A4:4!bend=1 A4:4 E4:8 F#4:8 A4:4!vib |
          E4:8 G#4:8 B4:4 G#4:8 E4:8 B3:4 |
          B4:8 A4:8 G#4:8 E4:8 D4:4!sl E4:4!vib |
          D4:8 A4:8 F#4:8 D4:8 A3:4 F#3:4 |
          E4:1!vib

  outro:
    bars: 2
    dynamic: f
    chords: "A | A"
    parts:
      gt1: { notes: "[A2 E3 A3 C#4 E4]:1~ | [A2 E3 A3 C#4 E4]:1" }
      bs: { notes: "A1:1~ | A1:1" }
      gt2: { notes: "A4:1~ | A4:1" }
      dr:
        grid: |
          cr: X--------------- | ----------------
          bd: X--------------- | ----------------

form: [intro, verse, chorus, verse2, chorus2, outro]

performance:
  seed: 7
  humanize: { timing_ms: 5, velocity: 0.04 }
  parts:
    dr:
      lanes:
        sd: { offset_ms: 6 }
        hh: { velocity: -0.05 }
    bs: { offset_ms: 3 }

mix:
  dr:  { gain_db: 0 }
  bs:  { gain_db: -1 }
  gt1: { gain_db: -2, pan: -0.35 }
  gt2: { gain_db: -3, pan: 0.35 }
  master: { gain_db: 0 }
