beat: 0.1

meta:
  title: Steel Nerve
  tempo: 128
  time: 4/4
  key: A major
  style: hard rock

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  riff_a:
    type: pitched
    bars: 1
    notes: "A2:8!pm A2!pm C#3!pm A2!pm E3!pm A2!pm G3 E3"
  stab_d:
    type: pitched
    bars: 1
    notes: "D3:8!pm D3!pm [D3 A3]:4 D3:8!pm D3!pm [D3 A3]:4"
  stab_e:
    type: pitched
    bars: 1
    notes: "E2:8!pm E2!pm [E2 B2]:4 E2:8!pm E2!pm [E2 B2]:4"
  ring_a:
    type: pitched
    bars: 1
    notes: "[A2 E3]:4. [A2 E3]:8~ [A2 E3]:2"
  ring_d:
    type: pitched
    bars: 1
    notes: "[D3 A3]:4. [D3 A3]:8~ [D3 A3]:2"
  ring_e:
    type: pitched
    bars: 1
    notes: "[E2 B2]:4. [E2 B2]:8~ [E2 B2]:2"
  bass_a:
    type: pitched
    bars: 1
    notes: "(A1:8)*8"
  bass_d:
    type: pitched
    bars: 1
    notes: "(D2:8)*8"
  bass_e:
    type: pitched
    bars: 1
    notes: "(E1:8)*8"
  beat_verse:
    type: drums
    bars: 1
    grid: |
      hh: x-x-x-x-x-x-x-x-
      sd: ----X-------X---
      bd: x-----x-x-------
  beat_chorus:
    type: drums
    bars: 1
    grid: |
      cr: X---------------
      hh: x-x-x-x-x-x-x-x-
      sd: ----X-------X---
      bd: x-x---x-x-x-----
  fill:
    type: drums
    bars: 1
    grid: |
      hh: x-x-x-x---------
      sd: ----X---xx------
      t1: ------------x---
      t2: -------------x--
      t3: --------------xX
      bd: x-------x-------

sections:
  intro:
    bars: 4
    dynamic: mf
    chords: "A5 | A5 | D5 | E5"
    parts:
      gt1:
        use: riff_a
        replace: { 3: { use: stab_d }, 4: { use: stab_e } }
      bs:
        use: bass_a
        replace: { 3: { use: bass_d }, 4: { use: bass_e } }
      dr:
        use: beat_verse
        replace: { 4: { use: fill } }

  verse:
    bars: 8
    dynamic: mf
    chords: "A5 | A5 | A5 | A5 | D5 | D5 | A5 | E5"
    parts:
      gt1:
        use: riff_a
        replace: { 5-6: { use: stab_d }, 8: { use: stab_e } }
      bs:
        use: bass_a
        replace: { 5-6: { use: bass_d }, 8: { use: bass_e } }
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }

  chorus:
    bars: 8
    dynamic: f
    chords: "A5 | A5 | D5 | E5 | A5 | A5 | D5 | E5"
    parts:
      gt1:
        use: ring_a
        replace: { 3: { use: ring_d }, 4: { use: ring_e }, 7: { use: ring_d }, 8: { use: ring_e } }
      bs:
        use: bass_a
        replace: { 3: { use: bass_d }, 4: { use: bass_e }, 7: { use: bass_d }, 8: { use: bass_e } }
      dr:
        use: beat_chorus
        replace: { 8: { use: fill } }

  verse_b:
    bars: 4
    dynamic: mf
    chords: "D5 | D5 | A5 | E5"
    parts:
      gt1:
        use: stab_d
        replace: { 3: { use: riff_a }, 4: { use: stab_e } }
      bs:
        use: bass_d
        replace: { 3: { use: bass_a }, 4: { use: bass_e } }
      dr:
        use: beat_verse
        replace: { 4: { use: fill } }

  chorus_solo:
    extends: chorus
    parts:
      gt2:
        notes: >-
          A4:8 C#5:8 E5:4 C#5:8 B4:8 A4:4 |
          D5:8 C#5:8 A4:4 F#4:8 E4:8 D4:4 |
          E4:8 F#4:8 G#4:4 A4:8 B4:8 C#5:4 |
          A4:2 E5:4 C#5:4 |
          E5:8 D5:8 C#5:8 B4:8 A4:4 C#5:4 |
          D5:4. C#5:8 A4:4 F#4:4 |
          G#4:8 A4:8 B4:8 C#5:8 D5:4 E5:4 |
          E5:4 C#5:4 A4:2!vib

  outro:
    bars: 2
    dynamic: f
    chords: "A5 | A5"
    parts:
      gt1:
        notes: "[A2 E3 A3]:1~ | [A2 E3 A3]:1"
      bs:
        notes: "A1:1~ | A1:1"
      dr:
        grid: |
          cr: X--------------- | ----------------
          bd: X--------------- | ----------------

form: [intro, verse, chorus, verse_b, chorus_solo, outro]

performance:
  seed: 11
  humanize: { timing_ms: 5, velocity: 0.04 }
  parts:
    dr:
      lanes:
        sd: { offset_ms: 6 }
        hh: { velocity: -0.04 }
    bs: { offset_ms: 3 }
    gt1: { strum_ms: 8 }

mix:
  dr:  { gain_db: 0 }
  bs:  { gain_db: -1 }
  gt1: { gain_db: -2, pan: -0.3 }
  gt2: { gain_db: -3, pan: 0.3 }
