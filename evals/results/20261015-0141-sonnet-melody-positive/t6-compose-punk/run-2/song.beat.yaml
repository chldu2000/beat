beat: 0.1

meta:
  title: Nothing Left But Summer
  tempo: 182
  time: 4/4
  key: D major
  style: melodic punk

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2 4
      bd: 1 2.5 3 3.5
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      ho: 1.5 2.5 3.5 4.5
      hh: 1 2 3 4
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5 3 3.5
      t1: 3.5
      t2: 4
      t3: 4.5
      bd: 1 3
  gtr_d:
    type: pitched
    bars: 1
    notes: "([D3 A3 D4]:8!pm)*8"

sections:
  intro:
    bars: 4
    chords: "D | D | G | A"
    parts:
      gt1:
        notes: >-
          ([D3 A3 D4]:8!pm)*8 | ([D3 A3 D4]:8!pm)*8 |
          ([G2 D3 G3]:8!pm)*8 | ([A2 E3 A3]:8!pm)*6 [A2 E3 A3]:4
      gt2:
        notes: >-
          r:1 | r:1 |
          D5:4 B4:4 G4:4 B4:4 | A4:4. E4:8 A4:2!vib
      bs:
        notes: "(D2:8)*8 | (D2:8)*8 | (G1:8)*8 | (A1:8)*8"
      dr:
        use: beat_verse
        replace:
          1-2: { hits: "hh: 1 2 3 4 | 1 2 3 4\nbd: 1 3 | 1 3\nsd: 4 | 4" }
          4: { use: fill }

  verse:
    bars: 8
    chords: "D | D | G | A | D | Bm | G | A"
    parts:
      gt1:
        notes: >-
          ([D3 A3 D4]:8!pm)*8 | ([D3 A3 D4]:8!pm)*8 |
          ([G2 D3 G3]:8!pm)*8 | ([A2 E3 A3]:8!pm)*8 |
          ([D3 A3 D4]:8!pm)*8 | ([B2 F#3 B3]:8!pm)*8 |
          ([G2 D3 G3]:8!pm)*8 | ([A2 E3 A3]:8!pm)*8
      gt2:
        dynamic: mf
        notes: >-
          F#4:4 F#4:8 G4:8 A4:4 F#4:4 |
          E4:4 D4:8 E4:8 F#4:2 |
          G4:4 G4:8 A4:8 B4:4 G4:4 |
          A4:4. G4:8 F#4:4 E4:4 |
          F#4:4 F#4:8 A4:8 D5:4 A4:4 |
          B4:4. A4:8 F#4:4 D4:4 |
          G4:4 B4:4 A4:4 G4:4 |
          E4:4 A4:4 C#5:2!vib
      bs:
        notes: >-
          (D2:8)*8 | (D2:8)*8 | (G1:8)*8 | (A1:8)*8 |
          (D2:8)*8 | (B1:8)*8 | (G1:8)*8 | (A1:8)*8
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }

  chorus:
    bars: 8
    dynamic: f
    chords: "G | A | D | Bm | G | A | D | D"
    parts:
      gt1:
        notes: >-
          [G2 D3 G3]:4 [G2 D3 G3]:8 [G2 D3 G3]:8 [G2 D3 G3]:4 [G2 D3 G3]:4 |
          [A2 E3 A3]:4 [A2 E3 A3]:8 [A2 E3 A3]:8 [A2 E3 A3]:4 [A2 E3 A3]:4 |
          [D3 A3 D4]:4 [D3 A3 D4]:8 [D3 A3 D4]:8 [D3 A3 D4]:4 [D3 A3 D4]:4 |
          [B2 F#3 B3]:4 [B2 F#3 B3]:8 [B2 F#3 B3]:8 [B2 F#3 B3]:4 [B2 F#3 B3]:4 |
          [G2 D3 G3]:4 [G2 D3 G3]:8 [G2 D3 G3]:8 [G2 D3 G3]:4 [G2 D3 G3]:4 |
          [A2 E3 A3]:4 [A2 E3 A3]:8 [A2 E3 A3]:8 [A2 E3 A3]:4 [A2 E3 A3]:4 |
          [D3 A3 D4]:4 [D3 A3 D4]:8 [D3 A3 D4]:8 [D3 A3 D4]:4 [D3 A3 D4]:4 |
          [D3 A3 D4]:4 [D3 A3 D4]:8 [D3 A3 D4]:8 [D3 A3 D4]:2
      gt2:
        dynamic: f
        notes: >-
          B4:4. B4:8 D5:4 B4:4 |
          C#5:4. C#5:8 E5:4 C#5:4 |
          D5:4. A4:8 F#4:4 A4:4 |
          B4:4. A4:8 F#4:2 |
          D5:4. D5:8 E5:4 D5:4 |
          E5:4. C#5:8 A4:2 |
          D5:4. A4:8 D5:4 F#5:4 |
          D5:2!vib r:2
      bs:
        notes: >-
          (G1:8)*8 | (A1:8)*8 | (D2:8)*8 | (B1:8)*8 |
          (G1:8)*8 | (A1:8)*8 | (D2:8)*8 | (D2:8)*6 A1:8 A1:8
      dr:
        use: beat_chorus
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }

  outro:
    bars: 4
    dynamic: f
    chords: "D | G | A | D"
    parts:
      gt1:
        notes: >-
          ([D3 A3 D4]:8)*8 | ([G2 D3 G3]:8)*8 | ([A2 E3 A3]:8)*8 | [D3 A3 D4]:1
      gt2:
        notes: "D5:4. A4:8 D5:2 | B4:4. G4:8 B4:2 | C#5:4. E4:8 A4:2 | D5:1!vib"
      bs:
        notes: "(D2:8)*8 | (G1:8)*8 | (A1:8)*8 | D2:1"
      dr:
        use: beat_chorus
        replace:
          4: { hits: "cr: 1!acc\nbd: 1!acc" }

form: [intro, verse, chorus, verse, chorus, outro]

performance:
  seed: 11
  humanize: { timing_ms: 4, velocity: 0.04 }

mix:
  space: room
  gt1: { gain_db: -2, pan: -0.4 }
  gt2: { gain_db: -1, pan: 0.3, reverb: more }
