beat: 0.1

meta:
  title: Highway Fuse
  tempo: 126
  time: 4/4
  key: A major
  style: hard rock

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 3 3.5
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      hh: 1 2 3 4
      ho: 1.5 2.5 3.5 4.5
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  beat_half:
    type: drums
    bars: 1
    hits: |
      rd: every 1
      sd: 3!acc
      bd: 1 2.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5
      t1: 3 3.5
      t2: 3.75 4
      t3: 4.5 4.75!acc
      bd: 1 3
  riff_a:
    type: pitched
    bars: 1
    notes: "(A2:8!pm)*6 C3:8 D3:8"
  bass_a:
    type: pitched
    bars: 1
    notes: "(A1:8)*6 C2:8 D2:8"

sections:
  intro:
    bars: 4
    dynamic: mf
    chords: "A | A | A | A"
    parts:
      gt1: { use: riff_a }
      bs:
        use: bass_a
        replace: { 1-2: { notes: "r:1 | r:1" } }
      dr:
        use: beat_verse
        replace:
          1-2: { hits: "hh: 1 2 3 4 | 1 2 3 4" }
          4: { use: fill }

  verse:
    bars: 8
    dynamic: mf
    chords: "A | A | D | A | A | A | D | E"
    parts:
      gt1:
        use: riff_a
        replace:
          3: { notes: "(D3:8!pm)*8" }
          7: { notes: "(D3:8!pm)*8" }
          8: { notes: "(E2:8!pm)*6 [E2 B2]:4" }
      bs:
        use: bass_a
        replace:
          3: { notes: "(D2:8)*8" }
          7: { notes: "(D2:8)*8" }
          8: { notes: "(E2:8)*6 E2:8 F#2:8" }
      gt2:
        notes: "r:1 | r:1 | r:1 | r:2 E4:4 A4:4 | r:1 | r:1 | r:1 | r:2 B4:4. G#4:8"
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }

  chorus:
    bars: 8
    dynamic: f
    chords: "A | D | E | A | A | D | E | E"
    parts:
      gt1:
        notes: >-
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8~ [E2 B2 E3]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8~ [E2 B2 E3]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 [E2 B2 E3]:4 [E2 B2 E3]:4
      bs:
        notes: "(A1:8)*8 | (D2:8)*8 | (E2:8)*8 | (A1:8)*8 | (A1:8)*8 | (D2:8)*8 | (E2:8)*8 | (E2:8)*8"
      dr:
        use: beat_chorus
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" }, 5: { hits: "cr: 1!acc" } }

  chorus2:
    extends: chorus
    parts:
      gt2:
        notes: >-
          E5:4. C5:8 A4:4 C5:4 |
          D5:2 A4:4 C5:4 |
          E5:4 G5:8 E5:8 D5:4 B4:4 |
          C5:4 A4:4 A4:2!vib |
          A5:4. G5:8 E5:4 C5:4 |
          A5:2 E5:4 D5:4 |
          G5:4 E5:4 D5:4 B4:4 |
          E5:2~ E5:2!fall

  bridge:
    bars: 4
    dynamic: mp
    chords: "F#m | D | E | E"
    parts:
      gt1:
        notes: "([F#2 C#3 F#3]:8!pm)*8 | ([D3 A3 D4]:8!pm)*8 | ([E2 B2 E3]:8!pm)*8 | ([E2 B2 E3]:8!pm)*6 [E2 B2 E3]:4"
      bs:
        notes: "(F#1:8)*8 | (D2:8)*8 | (E2:8)*8 | (E2:8)*8"
      dr:
        use: beat_half
        replace: { 4: { use: fill } }

  outro:
    bars: 2
    dynamic: f
    chords: "A | A"
    parts:
      gt1: { notes: "[A2 E3 A3]:1~ | [A2 E3 A3]:1" }
      bs: { notes: "A1:1~ | A1:1" }
      dr:
        hits: |
          cr: 1!acc |
          bd: 1!acc |

form: [intro, verse, chorus, bridge, chorus2, outro]

performance:
  seed: 11
  humanize: { timing_ms: 5, velocity: 0.04 }

mix:
  space: studio
  gt1: { pan: -0.4 }
  gt2: { pan: 0.4, reverb: more }
