beat: 0.1

meta:
  title: Thunder Down Main Street
  tempo: 128
  time: 4/4
  key: A major
  style: hard rock

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 3 3.5
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 2.5 3 4.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2
      t1: 2.5 3
      t2: 3.5 4
      t3: 4.5 4.75!acc
      bd: 1 3
  riff_a:
    type: pitched
    bars: 1
    notes: "(A2:8!pm)*6 C3:8 B2:8"
  riff_d:
    type: pitched
    bars: 1
    notes: "(D3:8!pm)*6 E3:8 D3:8"
  riff_e:
    type: pitched
    bars: 1
    notes: "(E3:8!pm)*6 F#3:8 E3:8"
  bass_a:
    type: pitched
    bars: 1
    notes: "(A1:8)*8"
  bass_d:
    type: pitched
    bars: 1
    notes: "(D2:8)*8"
  bass_e:
    type: pitched
    bars: 1
    notes: "(E2:8)*8"

sections:
  intro:
    bars: 4
    dynamic: mf
    chords: "A5 | A5 | A5 | A5"
    parts:
      gt1:
        use: riff_a
      bs:
        use: bass_a
        replace: { 1-2: { notes: "r:1 | r:1" } }
      dr:
        use: beat_verse
        replace:
          1-2: { hits: "hh: 1 2 3 4 | 1 2 3 4" }
          4: { use: fill }

  verse:
    bars: 8
    dynamic: mf
    chords: "A5 | A5 | D5 | D5 | A5 | A5 | D5 E5 | E5"
    parts:
      gt1:
        notes: >-
          (A2:8!pm)*8 | (A2:8!pm)*6 C3:8 B2:8 | (D3:8!pm)*8 | (D3:8!pm)*6 E3:8 D3:8 |
          (A2:8!pm)*8 | (A2:8!pm)*6 C3:8 B2:8 | (D3:8!pm)*4 (E3:8!pm)*4 | (E3:8!pm)*6 G3:8 F#3:8
      gt2:
        notes: "r:1 | r:1 | r:1 | r:2 E5:8 G5:8 A5:4 | r:1 | r:1 | r:1 | r:2 B4:8 D5:8 E5:4"
      bs:
        notes: >-
          (A1:8)*8 | % | (D2:8)*8 | % | (A1:8)*8 | % | (D2:8)*4 (E2:8)*4 | (E2:8)*8
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }

  chorus:
    bars: 8
    dynamic: f
    chords: "A5 | D5 | E5 | A5 | A5 | D5 | E5 | E5"
    parts:
      gt1:
        notes: >-
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:4. [A2 E3 A3]:8 |
          [D3 A3 D4]:4. [D3 A3 D4]:8 [D3 A3 D4]:4. [D3 A3 D4]:8 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 [E2 B2 E3]:4. [E2 B2 E3]:8 |
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:4. [A2 E3 A3]:8 |
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:4. [A2 E3 A3]:8 |
          [D3 A3 D4]:4. [D3 A3 D4]:8 [D3 A3 D4]:4. [D3 A3 D4]:8 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 [E2 B2 E3]:4. [E2 B2 E3]:8 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 [E2 B2 E3]:4 [E2 B2 E3]:4
      gt2:
        notes: >-
          E5:4. C#5:8 A4:4 C#5:4 |
          D5:4. F#5:8 A5:2!vib |
          G#5:4. E5:8 B4:4 E5:4 |
          A4:4 C#5:4 E5:2!vib |
          A5:4. E5:8 C#5:4 E5:4 |
          F#5:4. D5:8 A4:4 D5:4 |
          E5:8 G#5:8 B5:4 G#5:4 E5:4 |
          B5:4 G#5:4 E5:2!fall
      bs:
        notes: >-
          (A1:8)*8 | (D2:8)*8 | (E2:8)*8 | (A1:8)*8 | (A1:8)*8 | (D2:8)*8 | (E2:8)*8 | (E2:8)*6 B1:8 E2:8
      dr:
        use: beat_chorus
        add: { 1: { hits: "cr: 1!acc" }, 5: { hits: "cr: 1!acc" } }

  outro:
    bars: 2
    dynamic: f
    chords: "A5 | A5"
    parts:
      gt1: { notes: "[A2 E3 A3]:1 | [A2 E3 A3]:1" }
      gt2: { notes: "A5:1!vib | A5:1!fall" }
      bs: { notes: "A1:1 | A1:1" }
      dr:
        hits: |
          cr: 1!acc |
          bd: 1!acc |

form: [intro, verse, chorus, verse, chorus, outro]

performance:
  seed: 11
  humanize: { timing_ms: 5, velocity: 0.04 }
  parts:
    dr:
      lanes:
        sd: { offset_ms: 6 }
        hh: { velocity: -0.05 }
    bs: { offset_ms: 3 }

mix:
  space: studio
  bs:  { gain_db: -1 }
  gt1: { gain_db: -2, pan: -0.4 }
  gt2: { gain_db: -3, pan: 0.4, reverb: more }
  master: { style: rock, loudness: -14 }
