beat: 0.1

meta:
  title: Thunder Road Rattle
  tempo: 126
  time: 4/4
  key: A major
  style: hard rock

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 3 3.5
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  beat_half:
    type: drums
    bars: 1
    hits: |
      rd: every 1
      sd: 3!acc
      bd: 1 2.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5
      t1: 3 3.5
      t2: 4
      t3: 4.5
      bd: 1 3 4.5
  riff_a:
    type: pitched
    bars: 1
    notes: "(A2:8!pm)*2 [A2 E3]:8 (A2:8!pm)*2 [A2 E3]:8 (A2:8!pm)*2"
  riff_d:
    type: pitched
    bars: 1
    notes: "(D3:8!pm)*2 [D3 A3]:8 (D3:8!pm)*2 [D3 A3]:8 (D3:8!pm)*2"
  riff_e:
    type: pitched
    bars: 1
    notes: "(E2:8!pm)*2 [E2 B2]:8 (E2:8!pm)*2 [E2 B2]:8 (E2:8!pm)*2"
  bass_a:
    type: pitched
    bars: 1
    notes: "(A1:8)*8"
  bass_d:
    type: pitched
    bars: 1
    notes: "(D2:8)*8"
  bass_e:
    type: pitched
    bars: 1
    notes: "(E1:8)*8"

sections:
  intro:
    bars: 4
    chords: "A | A | A | A"
    parts:
      gt1:
        use: riff_a
        replace:
          4: { notes: "(A2:8!pm)*2 [A2 E3]:8 (A2:8!pm)*2 [A2 E3]:4 [A2 E3]:8" }
      bs:
        use: bass_a
        replace: { 1-2: { notes: "r:1 | r:1" } }
      dr:
        use: beat_verse
        replace:
          1-2: { hits: "hh: 1 2 3 4 | 1 2 3 4" }
          4: { use: fill }
        add: { 3: { hits: "cr: 1!acc" } }

  verse:
    bars: 8
    chords: "A | A | D | A | A | A | D | E"
    parts:
      gt1:
        notes: >-
          (A2:8!pm)*2 [A2 E3]:8 (A2:8!pm)*2 [A2 E3]:8 (A2:8!pm)*2 |
          (A2:8!pm)*2 [A2 E3]:8 (A2:8!pm)*2 [A2 E3]:8 (A2:8!pm)*2 |
          (D3:8!pm)*2 [D3 A3]:8 (D3:8!pm)*2 [D3 A3]:8 (D3:8!pm)*2 |
          (A2:8!pm)*2 [A2 E3]:8 (A2:8!pm)*2 [A2 E3]:8 (A2:8!pm)*2 |
          (A2:8!pm)*2 [A2 E3]:8 (A2:8!pm)*2 [A2 E3]:8 (A2:8!pm)*2 |
          (A2:8!pm)*2 [A2 E3]:8 (A2:8!pm)*2 [A2 E3]:8 (A2:8!pm)*2 |
          (D3:8!pm)*2 [D3 A3]:8 (D3:8!pm)*2 [D3 A3]:8 (D3:8!pm)*2 |
          (E2:8!pm)*2 [E2 B2]:8 (E2:8!pm)*2 [E2 B2]:8 [E2 B2]:8 [E2 B2]:8
      bs:
        use: bass_a
        replace:
          3: { use: bass_d }
          4: { notes: "(A1:8)*6 G1:8 A1:8" }
          7: { use: bass_d }
          8: { use: bass_e }
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }

  chorus:
    bars: 8
    dynamic: f
    chords: "A | D | A | E | A | D | E | E"
    parts:
      gt1:
        notes: >-
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8~ [E2 B2 E3]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 [E2 B2 E3]:4 [E2 B2 E3]:4 |
          [E2 B2 E3]:2 r:2
      bs:
        use: bass_a
        replace:
          2: { use: bass_d }
          4: { use: bass_e }
          6: { use: bass_d }
          7-8: { notes: "(E1:8)*8 | E1:2 r:2" }
      dr:
        use: beat_chorus
        add: { 1: { hits: "cr: 1!acc" }, 5: { hits: "cr: 1!acc" } }
        replace: { 8: { hits: "cr: 1!acc\nbd: 1" } }

  bridge:
    bars: 4
    dynamic: mf
    chords: "F#m | D | E | E"
    parts:
      gt1:
        notes: >-
          [F#2 C#3 F#3]:1 | [D3 A3 D4]:1 | [E2 B2 E3]:1 | [E2 B2 E3]:2 (E2:8!pm)*4
      bs:
        notes: "(F#1:8)*8 | (D2:8)*8 | (E1:8)*8 | (E1:8)*8"
      dr:
        use: beat_half
        replace: { 4: { use: fill } }

  chorus2:
    extends: chorus
    parts:
      gt2:
        notes: >-
          C5:8 D5:8 E5:4 A5:2!vib |
          D5:8 E5:8 D5:4 A4:4 r:4 |
          C5:8 D5:8 E5:4 G5:4 E5:4 |
          D5:4 B4:4 G#4:2!vib |
          A5:4. G5:8 E5:4 C5:4 |
          D5:8 E5:8 G5:4 E5:4 D5:4 |
          B4:8 D5:8 E5:4 G5:4 B5:4 |
          E5:2~ E5:2!fall

  outro:
    bars: 2
    dynamic: f
    chords: "A | A"
    parts:
      gt1: { notes: "[A2 E3 A3 C#4]:1~ | [A2 E3 A3 C#4]:1" }
      bs: { notes: "A1:1~ | A1:1" }
      dr:
        hits: |
          cr: 1!acc |
          bd: 1!acc |

form: [intro, verse, chorus, bridge, chorus2, outro]

performance:
  seed: 11
  humanize: { timing_ms: 5, velocity: 0.04 }
  parts:
    dr:
      lanes:
        sd: { offset_ms: 5 }
        hh: { velocity: -0.05 }
    bs: { offset_ms: 3 }

mix:
  space: studio
  bs:  { gain_db: -1 }
  gt1: { gain_db: -2, pan: -0.4 }
  gt2: { gain_db: -2, pan: 0.4, reverb: more }
  master: { style: rock, loudness: -14 }
