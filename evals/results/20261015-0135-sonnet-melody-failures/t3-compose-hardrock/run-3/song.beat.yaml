beat: 0.1

meta:
  title: Highway Fuse
  tempo: 128
  time: 4/4
  key: A major
  style: hard rock

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 3 3.5
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      cr: 1!acc
      rd: 1.5 2 2.5 3 3.5 4 4.5
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5
      t1: 3 3.5
      t2: 3.75 4
      t3: 4.5
      bd: 1 3 4.75!acc
  riff:
    type: pitched
    bars: 2
    notes: "A2:8!pm A2!pm A2!pm C3 A2!pm D3 A2!pm C3 | (A2:8!pm)*6 [A2 E3]:8 [A2 E3]:8"
  bass_a:
    type: pitched
    bars: 1
    notes: "(A1:8)*8"

sections:
  intro:
    bars: 4
    chords: "A | A | A | A"
    parts:
      gt1: { use: riff }
      bs:
        use: bass_a
        replace: { 1-2: { notes: "r:1 | r:1" } }
      dr:
        hits: |
          hh: 1 2 3 4 | 1 2 3 4 | every 0.5 | every 0.5
          sd: | | 2 4 | 2!acc 4!acc
          bd: 1 3 | 1 3 | 1 3 3.5 | 1 3
        replace: { 4: { use: fill } }

  verse:
    bars: 8
    chords: "A | A | D | A | A | A | D | E"
    parts:
      gt1:
        use: riff
        replace:
          3-4: { notes: "(D3:8!pm)*8 | (A2:8!pm)*8" }
          5-8: { notes: "(A2:8!pm)*8 | (A2:8!pm)*6 [A2 E3]:8 [A2 E3]:8 | (D3:8!pm)*8 | (E2:8!pm)*6 [E2 B2]:8 [E2 B2]:8" }
      bs:
        notes: "(A1:8)*8 | % | (D2:8)*8 | (A1:8)*8 | (A1:8)*8 | % | (D2:8)*8 | (E2:8)*8"
      dr:
        use: beat_verse
        add: { 1: { hits: "cr: 1!acc" } }

  verse2:
    extends: verse
    parts:
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }

  chorus:
    bars: 8
    dynamic: f
    chords: "A | D | A | E | A | D | E | A"
    parts:
      gt1:
        notes: >-
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:4. [A2 E3 A3]:8 |
          [D3 A3 D4]:4. [D3 A3 D4]:8 [D3 A3 D4]:4. [D3 A3 D4]:8 |
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:4. [A2 E3 A3]:8 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 [E2 B2 E3]:4. [E2 B2 E3]:8 |
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:4. [A2 E3 A3]:8 |
          [D3 A3 D4]:4. [D3 A3 D4]:8 [D3 A3 D4]:4. [D3 A3 D4]:8 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 [E2 B2 E3]:4. [E2 B2 E3]:8 |
          [A2 E3 A3]:2~ [A2 E3 A3]:2
      bs:
        notes: "(A1:8)*8 | (D2:8)*8 | (A1:8)*8 | (E2:8)*8 | (A1:8)*8 | (D2:8)*8 | (E2:8)*8 | A1:2~ A1:2"
      dr:
        use: beat_chorus
        replace: { 8: { hits: "cr: 1!acc\nbd: 1" } }

  chorus_last:
    extends: chorus
    parts:
      gt2:
        notes: >-
          E5:4. C#5:8 E5:4 C#5:4 |
          D5:4. A4:8 D5:2 |
          C#5:4 E5:4 A5:2!vib |
          G#5:4. E5:8 B4:2!fall |
          A5:8 G#5:8 E5:4 C#5:4 E5:4 |
          F#5:4. D5:8 A4:4 D5:4 |
          B4:4 E5:4 G#5:4 B5:4 |
          A5:2~ A5:2!fall

  outro:
    bars: 2
    dynamic: f
    chords: "A | A"
    parts:
      gt1: { notes: "[A2 E3 A3]:1!acc | [A2 E3 A3]:1" }
      bs: { notes: "A1:1 | A1:1" }
      dr:
        hits: |
          cr: 1!acc |
          bd: 1!acc |

form: [intro, verse, chorus, verse2, chorus_last, outro]

performance:
  seed: 11
  humanize: { timing_ms: 5, velocity: 0.04 }
  parts:
    dr:
      lanes:
        sd: { offset_ms: 5 }
        hh: { velocity: -0.05 }

mix:
  space: studio
  bs:  { gain_db: -1 }
  gt1: { gain_db: -2, pan: -0.4 }
  gt2: { gain_db: -2, pan: 0.4, reverb: more }
