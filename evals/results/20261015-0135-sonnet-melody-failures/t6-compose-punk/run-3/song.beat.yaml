beat: 0.1

meta:
  title: Nowhere Fast
  tempo: 180
  time: 4/4
  key: D major
  style: melodic punk

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_a:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2 4
      bd: 1 3 3.5
  beat_b:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5
      t1: 3 3.5
      t2: 4
      t3: 4.5
      bd: 1 3 4 4.5

sections:
  intro:
    bars: 4
    chords: "D | D | G | A"
    parts:
      dr:
        use: beat_a
        replace: { 4: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }
      bs: { notes: "(D2:8)*8 | % | (G1:8)*8 | (A1:8)*8" }
      gt1: { notes: "([D3 A3 D4]:8!pm)*8 | % | ([G2 D3 G3]:8!pm)*8 | ([A2 E3 A3]:8!pm)*8" }

  verse:
    bars: 8
    dynamic: mf
    chords: "D | D | G | A | D | Bm | G | A"
    parts:
      dr:
        use: beat_a
        replace: { 8: { use: fill } }
      bs: { notes: "(D2:8)*8 | % | (G1:8)*8 | (A1:8)*8 | (D2:8)*8 | (B1:8)*8 | (G1:8)*8 | (A1:8)*8" }
      gt1:
        notes: >-
          ([D3 A3 D4]:8!pm)*8 | % | ([G2 D3 G3]:8!pm)*8 | ([A2 E3 A3]:8!pm)*8 |
          ([D3 A3 D4]:8!pm)*8 | ([B2 F#3 B3]:8!pm)*8 | ([G2 D3 G3]:8!pm)*8 | ([A2 E3 A3]:8!pm)*8
      gt2:
        notes: >-
          r:8 D4:8 F#4:8 A4:8 A4:4 F#4:8 D4:8 |
          E4:8 F#4:8 E4:4 D4:2 |
          B4:8 B4:8 B4:8 A4:8 G4:4 B4:4 |
          A4:4 G4:8 F#4:8 E4:2 |
          r:8 D4:8 F#4:8 A4:8 B4:4 A4:8 F#4:8 |
          D5:4 B4:8 A4:8 B4:4 D5:4 |
          B4:8 A4:8 G4:4 A4:8 G4:8 E4:4 |
          E4:4 F#4:4 A4:4 r:8 A4:8

  chorus:
    bars: 8
    dynamic: f
    chords: "D | A | Bm | G | D | A | G A | D"
    parts:
      dr:
        use: beat_b
        replace: { 8: { hits: "cr: 1!acc\nbd: 1!acc" } }
        add: { 1: { hits: "cr: 1!acc" } }
      bs: { notes: "(D2:8)*8 | (A1:8)*8 | (B1:8)*8 | (G1:8)*8 | (D2:8)*8 | (A1:8)*8 | (G1:8)*4 (A1:8)*4 | D2:1" }
      gt1:
        notes: >-
          ([D3 A3 D4]:8)*8 | ([A2 E3 A3]:8)*8 | ([B2 F#3 B3]:8)*8 | ([G2 D3 G3]:8)*8 |
          ([D3 A3 D4]:8)*8 | ([A2 E3 A3]:8)*8 | ([G2 D3 G3]:8)*4 ([A2 E3 A3]:8)*4 | [D3 A3 D4]:1
      gt2:
        notes: >-
          D5:4. D5:8 A4:4 D5:4 |
          C#5:4. B4:8 A4:2 |
          B4:4. B4:8 D5:4 F#5:4 |
          E5:2 D5:4 B4:4 |
          D5:4. D5:8 A4:4 D5:4 |
          E5:4. C#5:8 E5:4 A5:4 |
          G5:4 F#5:4 E5:4 C#5:4 |
          D5:b3!vib r:4

  outro:
    bars: 4
    dynamic: f
    chords: "D | G | A | D"
    parts:
      dr:
        use: beat_b
        replace: { 4: { hits: "cr: 1!acc\nbd: 1!acc" } }
      bs: { notes: "(D2:8)*8 | (G1:8)*8 | (A1:8)*8 | D2:1" }
      gt1: { notes: "([D3 A3 D4]:8)*8 | ([G2 D3 G3]:8)*8 | ([A2 E3 A3]:8)*8 | [D3 A3 D4]:1" }

form: [intro, verse, chorus, verse, chorus, outro]

performance:
  seed: 11
  humanize: { timing_ms: 4, velocity: 0.04 }

mix:
  space: room
  gt1: { pan: -0.4 }
  gt2: { pan: 0.3, reverb: more }
