beat: 0.1

meta:
  title: Nowhere Fast
  tempo: 180
  time: 4/4
  key: D major
  style: melodic punk

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 3 3.5
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5 3
      t1: 3.5 3.75
      t2: 4 4.25
      t3: 4.5 4.75!acc
      bd: 1 3
  gt_verse:
    type: pitched
    bars: 8
    notes: >-
      ([D3 A3]:8!pm)*8 | ([D3 A3]:8!pm)*8 | ([G2 D3]:8!pm)*8 | ([A2 E3]:8!pm)*8 |
      ([D3 A3]:8!pm)*8 | ([B2 F#3]:8!pm)*8 | ([G2 D3]:8!pm)*8 | ([A2 E3]:8!pm)*8
  gt_chorus:
    type: pitched
    bars: 8
    notes: >-
      ([D3 A3 D4]:8)*8 | ([G2 D3 G3]:8)*8 | ([A2 E3 A3]:8)*8 | ([D3 A3 D4]:8)*8 |
      ([D3 A3 D4]:8)*8 | ([G2 D3 G3]:8)*8 | ([A2 E3 A3]:8)*8 | ([A2 E3 A3]:8)*8
  bs_verse:
    type: pitched
    bars: 8
    notes: >-
      (D2:8)*8 | (D2:8)*8 | (G1:8)*8 | (A1:8)*8 | (D2:8)*8 | (B1:8)*8 | (G1:8)*8 | (A1:8)*8
  bs_chorus:
    type: pitched
    bars: 8
    notes: >-
      (D2:8)*8 | (G1:8)*8 | (A1:8)*8 | (D2:8)*8 | (D2:8)*8 | (G1:8)*8 | (A1:8)*8 | (A1:8)*8

sections:
  intro:
    bars: 4
    dynamic: f
    chords: "D | D | G | A"
    parts:
      dr:
        use: beat_verse
        add: { 1: { hits: "cr: 1!acc" } }
        replace: { 4: { use: fill } }
      bs:
        notes: "(D2:8)*8 | (D2:8)*8 | (G1:8)*8 | (A1:8)*8"
      gt1:
        notes: "([D3 A3 D4]:8)*8 | ([D3 A3 D4]:8)*8 | ([G2 D3 G3]:8)*8 | ([A2 E3 A3]:8)*8"

  verse:
    bars: 8
    dynamic: mf
    chords: "D | D | G | A | D | Bm | G | A"
    parts:
      dr:
        use: beat_verse
        add: { 1: { hits: "cr: 1!acc" } }
        replace: { 8: { use: fill } }
      bs: { use: bs_verse }
      gt1: { use: gt_verse }
      gt2:
        notes: >-
          F#4:4 A4:8 A4:8 B4:4 A4:4 |
          F#4:4 D4:4 F#4:2 |
          G4:4 B4:8 B4:8 D5:4 B4:4 |
          A4:2 G4:4 E4:4 |
          F#4:4 A4:8 A4:8 B4:4 D5:4 |
          D5:4. B4:8 A4:4 F#4:4 |
          G4:4 B4:4 A4:4 G4:4 |
          E4:2 r:8 A4:8 A4:4

  chorus:
    bars: 8
    dynamic: f
    chords: "D | G | A | D | D | G | A | A"
    parts:
      dr:
        use: beat_chorus
        add: { 1: { hits: "cr: 1!acc" } }
        replace: { 8: { use: fill } }
      bs: { use: bs_chorus }
      gt1: { use: gt_chorus }
      gt2:
        notes: >-
          D5:4. D5:8 E5:4 F#5:4 |
          E5:4. D5:8 B4:2 |
          C#5:4. D5:8 E5:4 C#5:4 |
          D5:2!vib A4:2 |
          D5:4. D5:8 E5:4 F#5:4 |
          G5:4. F#5:8 E5:4 D5:4 |
          C#5:4 E5:4 A5:2 |
          A5:2!vib r:2

  outro:
    bars: 4
    dynamic: f
    chords: "D | G | A | D"
    parts:
      dr:
        hits: |
          cr: 1!acc | | | 1!acc
          hh: every 0.5 | every 0.5 | every 0.5 |
          sd: 2 4 | 2 4 | 2 4 |
          bd: 1 3 | 1 3 | 1 3 | 1
      bs:
        notes: "(D2:8)*8 | (G1:8)*8 | (A1:8)*8 | D2:1"
      gt1:
        notes: "([D3 A3 D4]:8)*8 | ([G2 D3 G3]:8)*8 | ([A2 E3 A3]:8)*8 | [D3 A3 D4]:1"

form: [intro, verse, chorus, verse, chorus, outro]

performance:
  seed: 11
  humanize: { timing_ms: 4, velocity: 0.04 }

mix:
  space: room
  bs:  { gain_db: -1 }
  gt1: { gain_db: -2, pan: -0.4 }
  gt2: { gain_db: -2, pan: 0.3, reverb: more }
