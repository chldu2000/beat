beat: 0.1

meta:
  title: Highway Fuse
  tempo: 128
  time: 4/4
  key: A major
  style: hard rock

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 2.5 3
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      hh: 1 1.5 2 2.5 3 3.5 4 4.5
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5
      t1: 3 3.5
      t2: 3.75 4
      t3: 4.5
      cr: 4.75!acc
      bd: 1 3
  riff:
    type: pitched
    bars: 2
    notes: "A2:8!pm A2:8!pm A2:8 C3:8 A2:8!pm D3:8 A2:8!pm C3:8 | A2:8!pm A2:8!pm A2:8 C3:8 A2:8!pm E3:8 D3:8 C3:8"
  bass_a:
    type: pitched
    bars: 2
    notes: "(A1:8)*8 | (A1:8)*6 C2:8 D2:8"

sections:
  intro:
    bars: 4
    chords: "A5 | A5 | A5 | A5"
    parts:
      gt1:
        use: riff
        replace: { 1-2: { notes: "(A2:8!pm)*8 | (A2:8!pm)*8" } }
      bs:
        use: bass_a
        replace: { 1-2: { notes: "r:1 | r:1" } }
      dr:
        use: beat_verse
        replace:
          1-2: { hits: "hh: 1 2 3 4 | 1 2 3 4" }
          4: { use: fill }

  verse:
    bars: 8
    dynamic: mf
    chords: "A5 | A5 | A5 | A5 | D5 | A5 | D5 | E5"
    parts:
      gt1:
        use: riff
        replace:
          5-6: { notes: "([D3 A3]:8!pm)*8 | (A2:8!pm)*8" }
          7-8: { notes: "([D3 A3]:8!pm)*8 | ([E3 B3]:8!pm)*8" }
      bs:
        use: bass_a
        replace:
          5-8: { notes: "(D2:8)*8 | (A1:8)*8 | (D2:8)*8 | (E2:8)*8" }
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }

  chorus:
    bars: 8
    dynamic: f
    chords: "A | D | E | A | A | D | E | A"
    parts:
      gt1:
        notes: >-
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [E3 B3 E4]:4. [E3 B3 E4]:8~ [E3 B3 E4]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8~ [A2 E3 A3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8~ [D3 A3 D4]:2 |
          [E3 B3 E4]:4. [E3 B3 E4]:8~ [E3 B3 E4]:2 |
          [A2 E3 A3]:1
      bs:
        notes: "(A1:8)*8 | (D2:8)*8 | (E2:8)*8 | (A1:8)*8 | (A1:8)*8 | (D2:8)*8 | (E2:8)*8 | A1:1"
      dr:
        use: beat_chorus
        replace:
          1: { hits: "cr: 1!acc\nhh: 1.5 2 2.5 3 3.5 4 4.5\nsd: 2!acc 4!acc\nbd: 1 1.5 3 3.5" }
          8: { hits: "cr: 1!acc\nbd: 1!acc" }

  chorus_last:
    extends: chorus
    parts:
      gt2:
        notes: >-
          r:2 E5:4 F#5:8 E5:8 | A5:2~ A5:2!vib | G#5:4 B5:4 A5:4 F#5:4 | E5:2~ E5:2!vib |
          r:2 E5:4 F#5:8 E5:8 | A5:4 C#6:4 B5:4 A5:4 | B5:4. A5:8 G#5:4 E5:4 | A5:1!fall

  break:
    bars: 4
    dynamic: mf
    chords: "A5 | A5 | D5 | E5"
    parts:
      gt1:
        notes: "(A2:8!pm)*8 | (A2:8!pm)*8 | ([D3 A3]:8!pm)*8 | ([E3 B3]:8!pm)*8"
      bs:
        notes: "(A1:8)*8 | (A1:8)*8 | (D2:8)*8 | (E2:8)*8"
      dr:
        use: beat_verse
        replace: { 4: { use: fill } }

  outro:
    bars: 2
    dynamic: f
    chords: "A5 | A5"
    parts:
      gt1: { notes: "[A2 E3 A3 C#4]:1~ | [A2 E3 A3 C#4]:1" }
      bs: { notes: "A1:1~ | A1:1" }
      dr:
        hits: |
          cr: 1!acc |
          bd: 1!acc |

form: [intro, verse, chorus, break, chorus_last, outro]

performance:
  seed: 11
  humanize: { timing_ms: 5, velocity: 0.04 }
  parts:
    dr:
      lanes:
        sd: { offset_ms: 5 }
        hh: { velocity: -0.05 }

mix:
  space: studio
  gt1: { gain_db: -2, pan: -0.4 }
  gt2: { gain_db: -3, pan: 0.4, reverb: more }
  master: { style: rock, loudness: -14 }
