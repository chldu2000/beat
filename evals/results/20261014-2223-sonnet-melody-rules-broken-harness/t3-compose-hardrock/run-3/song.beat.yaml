beat: 0.1

meta:
  title: Highway Thunder
  tempo: 128
  time: 4/4
  key: A major
  style: hard rock

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 3 3.5
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      ho: 1.5 2.5 3.5 4.5
      hh: 1 2 3 4
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5
      t1: 3 3.5
      t2: 4
      t3: 4.5
      bd: 1 3 4.5
  riff_a:
    type: pitched
    bars: 1
    notes: "(A2:8!pm)*4 [A2 E3]:4 [C3 G3]:8 [D3 A3]:8"
  riff_a2:
    type: pitched
    bars: 1
    notes: "(A2:8!pm)*6 [A2 E3]:4"
  riff_d:
    type: pitched
    bars: 1
    notes: "(D3:8!pm)*6 [D3 A3]:4"
  riff_e:
    type: pitched
    bars: 1
    notes: "(E2:8!pm)*6 [E3 B3]:4"
  bass_a:
    type: pitched
    bars: 1
    notes: "(A1:8)*8"
  bass_d:
    type: pitched
    bars: 1
    notes: "(D2:8)*8"
  bass_e:
    type: pitched
    bars: 1
    notes: "(E1:8)*8"
  chorus_gt:
    type: pitched
    bars: 1
    notes: "[A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:4 [A2 E3 A3]:4"

sections:
  intro:
    bars: 4
    dynamic: mf
    chords: "A5 | A5 | A5 | A5"
    parts:
      gt1:
        use: riff_a
        replace:
          2: { use: riff_a2 }
          3: { use: riff_a }
          4: { use: riff_a2 }
      bs:
        use: bass_a
        replace: { 1-2: { notes: "r:1 | r:1" } }
      dr:
        use: beat_verse
        replace:
          1-2: { hits: "hh: 1 2 3 4 | hh: 1 2 3 4" }
          4: { use: fill }

  verse:
    bars: 8
    dynamic: mf
    chords: "A5 | A5 | D5 | A5 | A5 | A5 | D5 | E5"
    parts:
      gt1:
        use: riff_a
        replace:
          2: { use: riff_a2 }
          3: { use: riff_d }
          4: { use: riff_a2 }
          6: { use: riff_a2 }
          7: { use: riff_d }
          8: { use: riff_e }
      bs:
        use: bass_a
        replace:
          3: { use: bass_d }
          7: { use: bass_d }
          8: { use: bass_e }
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }

  chorus:
    bars: 8
    dynamic: f
    chords: "A | D | E | A | A | D | E | E"
    parts:
      gt1:
        use: chorus_gt
        replace:
          2: { notes: "[D3 A3 D4]:4. [D3 A3 D4]:8 [D3 A3 D4]:4 [D3 A3 D4]:4" }
          3: { notes: "[E3 B3 E4]:4. [E3 B3 E4]:8 [E3 B3 E4]:4 [E3 B3 E4]:4" }
          6: { notes: "[D3 A3 D4]:4. [D3 A3 D4]:8 [D3 A3 D4]:4 [D3 A3 D4]:4" }
          7: { notes: "[E3 B3 E4]:4. [E3 B3 E4]:8 [E3 B3 E4]:4 [E3 B3 E4]:4" }
          8: { notes: "[E3 B3 E4]:4. [E3 B3 E4]:8 [E3 B3 E4]:4 r:4" }
      bs:
        use: bass_a
        replace:
          2: { use: bass_d }
          3: { use: bass_e }
          6: { use: bass_d }
          7: { use: bass_e }
          8: { notes: "(E1:8)*6 B1:8 E1:8" }
      dr:
        use: beat_chorus
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" }, 5: { hits: "cr: 1!acc" } }

  chorus_solo:
    extends: chorus
    parts:
      gt2:
        notes: >-
          E5:4. C#5:8 A4:4 C5:8 C#5:8 |
          A4:8 D5:8 F#5:4 E5:4 D5:4 |
          E5:4. G#4:8 B4:4 E5:4 |
          C#5:2~ C#5:4!vib r:4 |
          A5:4. E5:8 C#5:4 E5:4 |
          F#5:8 E5:8 D5:8 E5:8 F#5:4 A5:4 |
          E5:8 G#5:8 B5:2!vib E5:4 |
          B5:2~ B5:4!fall r:4

  verse2:
    extends: verse
    bars: 4
    chords: "A5 | A5 | D5 | E5"
    parts:
      gt1:
        use: riff_a
        replace:
          2: { use: riff_a2 }
          3: { use: riff_d }
          4: { use: riff_e }
      bs:
        use: bass_a
        replace:
          3: { use: bass_d }
          4: { use: bass_e }
      dr:
        use: beat_verse
        replace: { 4: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }

  outro:
    bars: 2
    dynamic: ff
    chords: "A5 | A5"
    parts:
      gt1: { notes: "[A2 E3 A3 C#4]:b3 r:b1 | [A2 E3 A3]:1~" }
      gt2: { notes: "A4:b2 r:b2 | r:1" }
      bs: { notes: "A1:b3 r:b1 | A1:1~" }
      dr:
        hits: |
          cr: 1!acc | cr: 1
          bd: 1!acc | bd: 1

form: [intro, verse, chorus, verse2, chorus_solo, outro]

performance:
  seed: 11
  humanize: { timing_ms: 5, velocity: 0.04 }
  parts:
    dr:
      lanes:
        sd: { offset_ms: 6 }
        hh: { velocity: -0.05 }
    bs: { offset_ms: 3 }

mix:
  space: room
  gt1: { gain_db: -2, pan: -0.4 }
  gt2: { gain_db: -3, pan: 0.4, reverb: more }
  bs: { gain_db: -1 }
  master: { style: rock, loudness: -14 }
