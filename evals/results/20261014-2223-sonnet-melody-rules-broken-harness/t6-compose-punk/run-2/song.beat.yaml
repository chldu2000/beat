beat: 0.1

meta:
  title: Last Bus Home
  tempo: 180
  time: 4/4
  key: D major
  style: melodic punk

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 2.5 3
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 2 3 3.25 3.5 3.75 4 4.25 4.5 4.75
      bd: 1 3
  gt_verse:
    type: pitched
    bars: 8
    notes: >-
      ([D3 A3 D4]:8!pm)*8 | ([A2 E3 A3]:8!pm)*8 | ([B2 F#3 B3]:8!pm)*8 | ([G2 D3 G3]:8!pm)*8 |
      ([D3 A3 D4]:8!pm)*8 | ([A2 E3 A3]:8!pm)*8 | ([B2 F#3 B3]:8!pm)*4 ([G2 D3 G3]:8!pm)*4 | ([A2 E3 A3]:8!pm)*8
  bs_verse:
    type: pitched
    bars: 8
    notes: "(D2:8)*8 | (A1:8)*8 | (B1:8)*8 | (G1:8)*8 | (D2:8)*8 | (A1:8)*8 | (B1:8)*4 (G1:8)*4 | (A1:8)*8"

sections:
  intro:
    bars: 4
    chords: "D | A | Bm | G"
    parts:
      gt1:
        notes: "([D3 A3 D4]:8!pm)*8 | ([A2 E3 A3]:8!pm)*8 | ([B2 F#3 B3]:8!pm)*8 | ([G2 D3 G3]:8!pm)*8"
      bs:
        notes: "(D2:8)*8 | (A1:8)*8 | (B1:8)*8 | (G1:8)*8"
      dr:
        use: beat_verse
        replace:
          1-2: { hits: "hh: 1 2 3 4 | 1 2 3 4\nsd: 1 2 3 4 | 1 2 3 4" }
          4: { use: fill }

  verse:
    bars: 8
    dynamic: mf
    chords: "D | A | Bm | G | D | A | Bm G | A"
    parts:
      gt1: { use: gt_verse }
      bs: { use: bs_verse }
      gt2:
        notes: >-
          r:8 F#4:8 A4:4 A4:8 B4:8 A4:4 | C#5:4. B4:8 A4:4 E4:4 | D5:4 B4:4 F#4:2 | r:4 G4:4 B4:4 A4:4 |
          r:8 F#4:8 A4:4 A4:8 B4:8 D5:4 | C#5:4. B4:8 A4:4 C#5:4 | D5:4 B4:4 G4:2 | A4:2~ A4:4!vib r:4
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }

  chorus:
    bars: 8
    dynamic: f
    chords: "G | D | A | Bm | G | D | A | A"
    parts:
      gt1:
        notes: >-
          [G2 D3 G3]:4. [G2 D3 G3]:8 [G2 D3 G3]:4 [G2 D3 G3]:4 |
          [D3 A3 D4]:4. [D3 A3 D4]:8 [D3 A3 D4]:4 [D3 A3 D4]:4 |
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:4 [A2 E3 A3]:4 |
          [B2 F#3 B3]:4. [B2 F#3 B3]:8 [B2 F#3 B3]:4 [B2 F#3 B3]:4 |
          [G2 D3 G3]:4. [G2 D3 G3]:8 [G2 D3 G3]:4 [G2 D3 G3]:4 |
          [D3 A3 D4]:4. [D3 A3 D4]:8 [D3 A3 D4]:4 [D3 A3 D4]:4 |
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:4 [A2 E3 A3]:4 |
          [A2 E3 A3]:2 r:2
      bs:
        notes: "(G1:8)*8 | (D2:8)*8 | (A1:8)*8 | (B1:8)*8 | (G1:8)*8 | (D2:8)*8 | (A1:8)*8 | (A1:8)*4 r:2"
      gt2:
        notes: >-
          B4:4. D5:8 D5:4 B4:4 | A4:4. F#4:8 A4:2 | C#5:4 E5:4 C#5:4. B4:8 | D5:2~ D5:4!vib r:4 |
          B4:4. D5:8 D5:4 E5:4 | F#5:4. E5:8 D5:4 A4:4 | C#5:4 E5:4 C#5:4 B4:4 | A4:2~ A4:4!vib r:4
      dr:
        use: beat_chorus
        replace: { 8: { hits: "sd: 1 2 3 3.25 3.5 3.75\nbd: 1 3" } }
        add: { 1: { hits: "cr: 1!acc" } }

  outro:
    bars: 4
    dynamic: f
    chords: "D | G | A | D"
    parts:
      gt1: { notes: "([D3 A3 D4]:8)*8 | ([G2 D3 G3]:8)*8 | ([A2 E3 A3]:8)*8 | [D3 A3 D4]:1" }
      bs: { notes: "(D2:8)*8 | (G1:8)*8 | (A1:8)*8 | D2:1" }
      gt2: { notes: "A4:2 F#4:2 | B4:2 D5:2 | C#5:4 E5:4 C#5:4 A4:4 | D5:1" }
      dr:
        use: beat_chorus
        replace:
          3: { hits: "sd: 1 2 3 3.5 4 4.5\nbd: 1 3" }
          4: { hits: "cr: 1!acc\nbd: 1!acc" }

form: [intro, verse, chorus, verse, chorus, outro]

performance:
  seed: 11
  humanize: { timing_ms: 4, velocity: 0.04 }

mix:
  space: room
  gt1: { pan: -0.5 }
  gt2: { pan: 0.35, reverb: more, gain_db: -2 }
