beat: 0.1

meta:
  title: Nowhere Fast
  tempo: 182
  time: 4/4
  key: D major
  style: melodic punk

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 2.5 3
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  fill:
    type: drums
    bars: 1
    hits: |
      hh: 1 1.5 2
      sd: 2 3 3.25
      t1: 3.5 3.75
      t2: 4 4.25
      t3: 4.5 4.75!acc
      bd: 1 3
  intro_hook:
    type: pitched
    bars: 4
    notes: "r:1 | r:1 | D5:4 C#5:4 B4:4 A4:4 | A4:2 r:2"

sections:
  intro:
    bars: 4
    chords: "D | G | A | A"
    parts:
      dr:
        use: beat_verse
        replace:
          1: { hits: "sd: 1 2 3 4\nbd: 1 3" }
          4: { use: fill }
        add: { 1: { hits: "cr: 1!acc" } }
      bs: { notes: "(D2:8)*8 | (G1:8)*8 | (A1:8)*8 | (A1:8)*8" }
      gt1:
        notes: >-
          ([D3 A3 D4]:8!pm)*8 | ([G2 D3 G3]:8!pm)*8 | ([A2 E3 A3]:8!pm)*8 | ([A2 E3 A3]:8)*6 [A2 E3 A3]:4
      gt2: { use: intro_hook }

  verse:
    bars: 8
    dynamic: mf
    chords: "D | D | G | A | D | Bm | G | A"
    parts:
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
      bs: { notes: "(D2:8)*8 | (D2:8)*8 | (G1:8)*8 | (A1:8)*8 | (D2:8)*8 | (B1:8)*8 | (G1:8)*8 | (A1:8)*8" }
      gt1:
        notes: >-
          ([D3 A3 D4]:8!pm)*8 | ([D3 A3 D4]:8!pm)*8 | ([G2 D3 G3]:8!pm)*8 | ([A2 E3 A3]:8!pm)*8 |
          ([D3 A3 D4]:8!pm)*8 | ([B2 F#3 B3]:8!pm)*8 | ([G2 D3 G3]:8!pm)*8 | ([A2 E3 A3]:8!pm)*8
      gt2:
        notes: >-
          r:4 F#4:8 F#4:8 A4:4 F#4:4 | E4:8 D4:8 F#4:2 r:4 |
          r:4 G4:8 G4:8 B4:4 A4:4 | G4:8 F#4:8 E4:2 r:4 |
          r:4 F#4:8 F#4:8 A4:4 D5:4 | D5:4. B4:8 A4:2 |
          B4:4 A4:8 G4:8 B4:4 D5:4 | C#5:2~ C#5:4!vib r:4

  chorus:
    bars: 8
    dynamic: f
    chords: "G | D | A | Bm | G | D | A | D"
    parts:
      dr:
        use: beat_chorus
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" }, 5: { hits: "cr: 1!acc" } }
      bs: { notes: "(G1:8)*8 | (D2:8)*8 | (A1:8)*8 | (B1:8)*8 | (G1:8)*8 | (D2:8)*8 | (A1:8)*8 | (D2:8)*8" }
      gt1:
        notes: >-
          ([G2 D3 G3]:8)*8 | ([D3 A3 D4]:8)*8 | ([A2 E3 A3]:8)*8 | ([B2 F#3 B3]:8)*8 |
          ([G2 D3 G3]:8)*8 | ([D3 A3 D4]:8)*8 | ([A2 E3 A3]:8)*8 | ([D3 A3 D4]:8)*6 [D3 A3 D4]:4
      gt2:
        notes: >-
          B4:4 D5:4 D5:4. B4:8 | A4:2 F#4:4 A4:4 |
          C#5:4 E5:4 E5:4. C#5:8 | D5:2~ D5:4!vib r:4 |
          B4:4 D5:4 G5:4. F#5:8 | F#5:4 E5:4 D5:4 A4:4 |
          C#5:4. B4:8 A4:2 | D5:2~ D5:4!fall r:4

  outro:
    bars: 4
    dynamic: f
    chords: "D | G | A | D"
    parts:
      dr:
        use: beat_chorus
        replace:
          4: { hits: "cr: 1!acc\nbd: 1!acc" }
      bs: { notes: "(D2:8)*8 | (G1:8)*8 | (A1:8)*8 | D2:1" }
      gt1:
        notes: >-
          ([D3 A3 D4]:8)*8 | ([G2 D3 G3]:8)*8 | ([A2 E3 A3]:8)*8 | [D3 A3 D4]:1
      gt2:
        notes: "r:1 | r:1 | r:1 | D5:1!fall"

form: [intro, verse, chorus, verse, chorus, outro]

performance:
  seed: 11
  humanize: { timing_ms: 4, velocity: 0.04 }

mix:
  space: room
  gt1: { pan: -0.4 }
  gt2: { pan: 0.3, reverb: more }
