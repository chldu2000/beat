beat: 0.1

meta:
  title: Highway Thunder
  tempo: 128
  time: 4/4
  key: A major
  style: hard rock

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 3 3.5
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      ho: 1.5 2.5 3.5 4.5
      hh: 1 2 3 4
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5
      t1: 3 3.5
      t2: 4
      t3: 4.5
      bd: 1 3 4 4.5
  riff_a:
    type: pitched
    bars: 1
    notes: "(A2:8!pm)*6 [A2 E3 A3]:4"
  riff_d:
    type: pitched
    bars: 1
    notes: "(D3:8!pm)*6 [D3 A3 D4]:4"
  riff_e:
    type: pitched
    bars: 1
    notes: "(E2:8!pm)*6 [E2 B2 E3]:4"
  bass_a:
    type: pitched
    bars: 1
    notes: "(A1:8)*8"
  bass_d:
    type: pitched
    bars: 1
    notes: "(D2:8)*8"
  bass_e:
    type: pitched
    bars: 1
    notes: "(E2:8)*8"

sections:
  intro:
    bars: 4
    chords: "A5 | A5 | A5 | A5"
    parts:
      gt1:
        notes: "(A2:8!pm)*8 | % | (A2:8!pm)*6 [A2 E3 A3]:4 | [A2 E3 A3]:2 [D3 A3 D4]:4 [E2 B2 E3]:4"
      bs:
        notes: "r:1 | r:1 | (A1:8)*8 | A1:2 D2:4 E2:4"
      dr:
        hits: |
          hh: 1 2 3 4 | 1 2 3 4 | every 0.5 | 1 3
          sd: | | 2 4 | 1 1.5 2 2.5 3 3.5 4 4.5
          bd: 1 3 | 1 3 | 1 3 3.5 | 1 3
          t1: | | |
          cr: | | |

  verse:
    bars: 8
    dynamic: mf
    chords: "A5 | A5 | D5 | A5 | A5 | D5 | A5 | E5"
    parts:
      gt1:
        notes: >-
          (A2:8!pm)*6 [A2 E3 A3]:4 | (A2:8!pm)*6 [A2 E3 A3]:4 |
          (D3:8!pm)*6 [D3 A3 D4]:4 | (A2:8!pm)*6 [A2 E3 A3]:4 |
          (A2:8!pm)*6 [A2 E3 A3]:4 | (D3:8!pm)*6 [D3 A3 D4]:4 |
          (A2:8!pm)*6 [A2 E3 A3]:4 | (E2:8!pm)*6 [E2 B2 E3]:4
      bs:
        notes: >-
          (A1:8)*8 | (A1:8)*8 | (D2:8)*8 | (A1:8)*8 |
          (A1:8)*8 | (D2:8)*8 | (A1:8)*8 | (E2:8)*6 E2:8 D2:8
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }

  chorus:
    bars: 8
    dynamic: f
    chords: "A5 | D5 | A5 | E5 | A5 | D5 | E5 | A5"
    parts:
      gt1:
        notes: >-
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8 [D3 A3 D4]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 [E2 B2 E3]:2 |
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:2 |
          [D3 A3 D4]:4. [D3 A3 D4]:8 [D3 A3 D4]:2 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 [E2 B2 E3]:2 |
          [A2 E3 A3]:1
      bs:
        notes: >-
          (A1:8)*8 | (D2:8)*8 | (A1:8)*8 | (E2:8)*8 |
          (A1:8)*8 | (D2:8)*8 | (E2:8)*8 | A1:1
      dr:
        use: beat_chorus
        replace:
          8: { hits: "cr: 1!acc\nbd: 1!acc" }
        add: { 1: { hits: "cr: 1!acc" } }

  chorus_last:
    extends: chorus
    parts:
      dr:
        use: beat_chorus
        replace:
          8: { hits: "cr: 1!acc\nbd: 1!acc" }
        add: { 1: { hits: "cr: 1!acc" } }
      gt2:
        notes: >-
          A4:8 C#5:8 E5:4 F#5:4 E5:4 |
          F#5:2 E5:4 D5:4 |
          C#5:4 E5:4 A5:2!vib |
          G#5:4 F#5:4 E5:4 r:4 |
          A5:4. E5:8 C#5:4 E5:4 |
          F#5:4. E5:8 D5:4 F#5:4 |
          B5:4 G#5:4 E5:2!vib |
          A5:2~ A5:2!fall

  outro:
    bars: 2
    dynamic: f
    chords: "A5 | A5"
    parts:
      gt1: { notes: "[A2 E3 A3 E4]:1~ | [A2 E3 A3 E4]:1" }
      bs: { notes: "A1:1~ | A1:1" }
      gt2: { notes: "A5:1!vib~ | A5:1!fall" }
      dr:
        hits: |
          cr: 1!acc |
          bd: 1!acc |

form: [intro, verse, chorus, verse, chorus_last, outro]

performance:
  seed: 11
  humanize: { timing_ms: 5, velocity: 0.04 }
  parts:
    dr:
      lanes:
        sd: { offset_ms: 6 }
        hh: { velocity: -0.05 }
    bs: { offset_ms: 3 }

mix:
  space: studio
  dr:  { gain_db: 0 }
  bs:  { gain_db: -1 }
  gt1: { gain_db: -2, pan: -0.4 }
  gt2: { gain_db: -3, pan: 0.4, reverb: more }
  master: { style: rock, loudness: -14 }
