beat: 0.1

meta:
  title: Highway Fuse
  tempo: 126
  time: 4/4
  key: A major
  style: hard rock

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 3 3.5
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      cr: 1!acc
      hh: 1.5 2 2.5 3 3.5 4 4.5
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5 3 3.25
      t1: 3.5 3.75
      t2: 4 4.25
      t3: 4.5 4.75!acc
      bd: 1 3
  riff:
    type: pitched
    bars: 2
    notes: "(A2:8!pm)*4 C#3:8 E3:8 C#3:8 A2:8 | (A2:8!pm)*4 D3:8 E3:8 D3:8 C#3:8"
  bass_riff:
    type: pitched
    bars: 2
    notes: "(A1:8)*8 | (A1:8)*6 B1:8 C#2:8"

sections:
  intro:
    bars: 4
    chords: "A5 | A5 | A5 | A5"
    parts:
      gt1: { use: riff }
      bs:
        use: bass_riff
        replace: { 1-2: { notes: "r:1 | r:1" } }
      dr:
        use: beat_verse
        replace:
          1-2: { hits: "hh: 1 2 3 4 | 1 2 3 4" }
        add: { 3: { hits: "cr: 1!acc" } }

  verse:
    bars: 8
    chords: "A5 | A5 | D5 | A5 | A5 | A5 | D5 | E5"
    parts:
      gt1:
        notes: >-
          ([A2 E3]:8!pm)*8 | ([A2 E3]:8!pm)*8 | ([D3 A3]:8!pm)*8 | ([A2 E3]:8!pm)*8 |
          ([A2 E3]:8!pm)*8 | ([A2 E3]:8!pm)*6 [A2 E3]:8!pm [C#3 G#3]:8!pm | ([D3 A3]:8!pm)*8 | ([E2 B2]:8!pm)*6 [E2 B2]:4
      bs:
        notes: "(A1:8)*8 | (A1:8)*8 | (D2:8)*8 | (A1:8)*8 | (A1:8)*8 | (A1:8)*8 | (D2:8)*8 | (E2:8)*6 E2:4"
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }

  chorus:
    bars: 8
    dynamic: f
    chords: "A | D | E | A | A | D | E | E"
    parts:
      gt1:
        notes: >-
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:4 [A2 E3 A3]:4 |
          [D3 A3 D4]:4. [D3 A3 D4]:8 [D3 A3 D4]:4 [D3 A3 D4]:4 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 [E2 B2 E3]:4 [E2 B2 E3]:4 |
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:4 [A2 E3 A3]:4 |
          [A2 E3 A3]:4. [A2 E3 A3]:8 [A2 E3 A3]:4 [A2 E3 A3]:4 |
          [D3 A3 D4]:4. [D3 A3 D4]:8 [D3 A3 D4]:4 [D3 A3 D4]:4 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 [E2 B2 E3]:4 [E2 B2 E3]:4 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 [E2 B2 E3]:2
      gt2:
        notes: >-
          A4:4. C#5:8 E5:4 C#5:4 |
          D5:4. F#5:8 A5:2!vib |
          G#5:4. E5:8 B4:4 E5:4 |
          A5:2~ A5:b1!vib r:b1 |
          A4:8 C#5:8 E5:8 A5:8 G#5:4 E5:4 |
          F#5:4. E5:8 D5:4 F#5:4 |
          E5:8 G#5:8 B5:4 G#5:4 E5:4 |
          B5:2~ B5:b1!fall r:b1
      bs:
        notes: "(A1:8)*8 | (D2:8)*8 | (E2:8)*8 | (A1:8)*8 | (A1:8)*8 | (D2:8)*8 | (E2:8)*8 | (E2:8)*6 E2:4"
      dr:
        use: beat_chorus
        replace: { 8: { use: fill } }

  break:
    bars: 4
    chords: "D5 | E5 | D5 | E5"
    parts:
      gt1:
        notes: >-
          ([D3 A3]:8!pm)*8 | ([E2 B2]:8!pm)*8 | ([D3 A3]:8!pm)*8 | ([E2 B2]:8!pm)*6 [E2 B2]:4
      bs:
        notes: "(D2:8)*8 | (E2:8)*8 | (D2:8)*8 | (E2:8)*8"
      dr:
        use: beat_verse
        replace: { 4: { use: fill } }

  outro:
    bars: 2
    dynamic: ff
    chords: "A5 | A5"
    parts:
      gt1: { notes: "[A2 E3 A3]:1~ | [A2 E3 A3]:1" }
      bs: { notes: "A1:1~ | A1:1" }
      dr:
        hits: |
          cr: 1!acc |
          bd: 1!acc |

form: [intro, verse, chorus, break, chorus, outro]

performance:
  seed: 11
  humanize: { timing_ms: 5, velocity: 0.04 }
  parts:
    dr:
      lanes:
        sd: { offset_ms: 5 }
    bs: { offset_ms: 3 }

mix:
  space: studio
  bs:  { gain_db: -1 }
  gt1: { gain_db: -2, pan: -0.4 }
  gt2: { gain_db: -3, pan: 0.4, reverb: more }
