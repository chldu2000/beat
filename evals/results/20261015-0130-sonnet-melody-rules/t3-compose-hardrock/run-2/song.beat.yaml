beat: 0.1

meta:
  title: Highway Fuse
  tempo: 128
  time: 4/4
  key: A major
  style: hard rock

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 3 3.5
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      cr: 1!acc
      rd: 1.5 2 2.5 3 3.5 4 4.5
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  beat_break:
    type: drums
    bars: 1
    hits: |
      hh: 1 2 3 4
      sd: 2!acc 4!acc
      bd: 1 3
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5 3 3.25
      t1: 3.5 3.75
      t2: 4 4.25
      t3: 4.5 4.75!acc
      bd: 1 3
  riff_a:
    type: pitched
    bars: 1
    notes: "(A2:8!pm)*6 B2:8!pm C#3:8"
  riff_d:
    type: pitched
    bars: 1
    notes: "(D3:8!pm)*6 E3:8!pm F#3:8"
  riff_e:
    type: pitched
    bars: 1
    notes: "(E2:8!pm)*6 F#2:8!pm G#2:8"
  bass_a:
    type: pitched
    bars: 1
    notes: "(A1:8)*8"
  bass_d:
    type: pitched
    bars: 1
    notes: "(D2:8)*8"
  bass_e:
    type: pitched
    bars: 1
    notes: "(E2:8)*8"

sections:
  intro:
    bars: 4
    dynamic: mf
    chords: "A | A | D | E"
    parts:
      gt1:
        notes: "(A2:8!pm)*6 B2:8!pm C#3:8 | % | (D3:8!pm)*6 E3:8!pm F#3:8 | (E2:8!pm)*6 F#2:8!pm G#2:8"
      bs:
        notes: "r:1 | r:1 | (D2:8)*8 | (E2:8)*8"
      dr:
        use: beat_verse
        replace:
          1-2: { hits: "hh: 1 2 3 4 | 1 2 3 4" }
          4: { use: fill }

  verse:
    bars: 8
    dynamic: mf
    chords: "A | A | D | A | A | A | D | E"
    parts:
      gt1:
        use: riff_a
        replace:
          3: { use: riff_d }
          7: { use: riff_d }
          8: { use: riff_e }
      bs:
        use: bass_a
        replace:
          3: { use: bass_d }
          7: { use: bass_d }
          8: { use: bass_e }
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }

  chorus:
    bars: 8
    dynamic: f
    chords: "A | D | E | A | A | D | E | E"
    parts:
      gt1:
        notes: >-
          [A2 E3 A3]:4. [A2 E3 A3]:8 r:8 [A2 E3 A3]:8 [A2 E3 A3]:4 |
          [D3 A3 D4]:4. [D3 A3 D4]:8 r:8 [D3 A3 D4]:8 [D3 A3 D4]:4 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 r:8 [E2 B2 E3]:8 [E2 B2 E3]:4 |
          [A2 E3 A3]:4. [A2 E3 A3]:8 r:8 [A2 E3 A3]:8 [A2 E3 A3]:4 |
          [A2 E3 A3]:4. [A2 E3 A3]:8 r:8 [A2 E3 A3]:8 [A2 E3 A3]:4 |
          [D3 A3 D4]:4. [D3 A3 D4]:8 r:8 [D3 A3 D4]:8 [D3 A3 D4]:4 |
          [E2 B2 E3]:4. [E2 B2 E3]:8 r:8 [E2 B2 E3]:8 [E2 B2 E3]:4 |
          [E2 B2 E3]:2 [E2 B2 E3]:4 r:4
      gt2:
        notes: >-
          E5:4. C#5:8 A4:4 C#5:4 |
          D5:2 F#5:4 E5:4 |
          B4:4. G#4:8 B4:2 |
          A4:2~ A4:4!vib r:4 |
          E5:4. D5:8 C#5:4 E5:4 |
          F#5:4. E5:8 D5:4 A4:4 |
          G#5:4. F#5:8 E5:4 B4:4 |
          E5:2~ E5:4!fall r:4
      bs:
        use: bass_a
        replace:
          2: { use: bass_d }
          3: { use: bass_e }
          6: { use: bass_d }
          7-8: { use: bass_e }
      dr:
        use: beat_chorus
        replace: { 8: { use: fill } }

  break:
    bars: 4
    dynamic: mf
    chords: "A | A | D | E"
    parts:
      gt1:
        notes: "[A2 E3 A3]:2 r:4 [A2 E3 A3]:4 | [A2 E3 A3]:2 r:4 [A2 E3 A3]:4 | [D3 A3 D4]:2 r:4 [D3 A3 D4]:4 | [E2 B2 E3]:2 [E2 B2 E3]:4 r:4"
      gt2:
        notes: "r:1 | A4:2!bend=2~ A4:4!vib r:4 | r:2 D5:4 F#5:4 | E5:2~ E5:4!vib r:4"
      bs:
        notes: "A1:2 r:4 A1:4 | A1:2 r:4 A1:4 | D2:2 r:4 D2:4 | E2:2 E2:4 r:4"
      dr:
        use: beat_break
        replace: { 4: { use: fill } }

form: [intro, verse, chorus, break, chorus]

performance:
  seed: 11
  humanize: { timing_ms: 5, velocity: 0.04 }
  parts:
    dr:
      lanes:
        sd: { offset_ms: 6 }
        hh: { velocity: -0.05 }
    bs: { offset_ms: 3 }

mix:
  space: studio
  dr:  { gain_db: 0 }
  bs:  { gain_db: -1 }
  gt1: { gain_db: -2, pan: -0.4 }
  gt2: { gain_db: -3, pan: 0.4, reverb: more }
  master: { style: rock, loudness: -14 }
