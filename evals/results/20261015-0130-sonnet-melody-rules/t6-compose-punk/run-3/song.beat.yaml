beat: 0.1

meta:
  title: Nothing To Do Till Friday
  tempo: 180
  time: 4/4
  key: D major
  style: melodic punk

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 2.5 3 3.5
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 1.5 2.5 3 3.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5
      t1: 3 3.5
      t2: 4
      t3: 4.5
      bd: 1 3

sections:
  intro:
    bars: 4
    dynamic: f
    chords: "D | D | G | A"
    parts:
      dr:
        use: beat_verse
        replace: { 4: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }
      bs:
        notes: "(D2:8)*8 | (D2:8)*8 | (G1:8)*8 | (A1:8)*8"
      gt1:
        notes: "([D3 A3]:8!pm)*8 | ([D3 A3]:8!pm)*8 | ([G2 D3]:8!pm)*8 | ([A2 E3]:8!pm)*8"
      gt2:
        notes: "r:1 | r:1 | G4:8 B4:8 D5:8 B4:8 G4:4 B4:4 | A4:4 C#5:4 E5:b2!vib"

  verse:
    bars: 8
    dynamic: mf
    chords: "D | D | G | A | D | Bm | G | A"
    parts:
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
      bs:
        notes: "(D2:8)*8 | (D2:8)*8 | (G1:8)*8 | (A1:8)*8 | (D2:8)*8 | (B1:8)*8 | (G1:8)*8 | (A1:8)*8"
      gt1:
        notes: "([D3 A3]:8!pm)*8 | ([D3 A3]:8!pm)*8 | ([G2 D3]:8!pm)*8 | ([A2 E3]:8!pm)*8 | ([D3 A3]:8!pm)*8 | ([B2 F#3]:8!pm)*8 | ([G2 D3]:8!pm)*8 | ([A2 E3]:8!pm)*8"
      gt2:
        notes: >-
          r:2 F#4:8 F#4:8 A4:4 |
          B4:4. A4:8 F#4:2 |
          G4:8 G4:8 B4:4 D5:4 B4:4 |
          A4:b3!vib r:b1 |
          r:2 F#4:8 F#4:8 A4:4 |
          B4:4. A4:8 B4:4 D5:4 |
          D5:4. B4:8 G4:2 |
          E4:8 E4:8 A4:4 C#5:b2!fall

  chorus:
    bars: 8
    dynamic: f
    chords: "G | D | A | Bm | G | D | A | D"
    parts:
      dr:
        use: beat_chorus
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" }, 5: { hits: "cr: 1!acc" } }
      bs:
        notes: "(G1:8)*8 | (D2:8)*8 | (A1:8)*8 | (B1:8)*8 | (G1:8)*8 | (D2:8)*8 | (A1:8)*8 | (D2:8)*8"
      gt1:
        notes: "([G2 D3 G3]:8)*8 | ([D3 A3 D4]:8)*8 | ([A2 E3 A3]:8)*8 | ([B2 F#3 B3]:8)*8 | ([G2 D3 G3]:8)*8 | ([D3 A3 D4]:8)*8 | ([A2 E3 A3]:8)*8 | [D3 A3 D4]:4. [D3 A3 D4]:8 [D3 A3 D4]:2"
      gt2:
        notes: >-
          D5:4. B4:8 D5:4 E5:4 |
          F#5:b3!vib E5:8 D5:8 |
          E5:4. D5:8 C#5:4 A4:4 |
          B4:b3!vib r:b1 |
          D5:4. B4:8 D5:4 G5:4 |
          F#5:4. E5:8 D5:2 |
          E5:4. D5:8 C#5:4 E5:4 |
          D5:b3!vib r:b1

  outro:
    bars: 4
    dynamic: f
    chords: "D | G | A | D"
    parts:
      dr:
        hits: |
          hh: every 0.5 | every 0.5 | every 0.5 |
          sd: 2 4 | 2 4 | 2 4 |
          bd: 1 3 | 1 3 | 1 3 | 1!acc
          cr: 1!acc | | | 1!acc
      bs:
        notes: "(D2:8)*8 | (G1:8)*8 | (A1:8)*8 | D2:1"
      gt1:
        notes: "([D3 A3 D4]:8)*8 | ([G2 D3 G3]:8)*8 | ([A2 E3 A3]:8)*8 | [D3 A3 D4]:1"
      gt2:
        notes: "D5:b3 F#5:4 | G5:4. F#5:8 D5:2 | E5:4. C#5:8 A4:2 | D5:b4!vib"

form: [intro, verse, chorus, verse, chorus, outro]

performance:
  seed: 11
  humanize: { timing_ms: 5, velocity: 0.04 }
  parts:
    dr:
      lanes:
        hh: { velocity: -0.05 }

mix:
  space: room
  dr:  { gain_db: 0 }
  bs:  { gain_db: -1 }
  gt1: { gain_db: -2, pan: -0.5 }
  gt2: { gain_db: -2, pan: 0.4, reverb: more }
  master: { style: rock, loudness: -14 }
