beat: 0.1

meta:
  title: Last Bus Home
  tempo: 182
  time: 4/4
  key: D major
  style: melodic punk

instruments:
  dr:  { type: drums }
  bs:  { type: bass }
  gt1: { type: guitar, tone: crunch }
  gt2: { type: guitar, tone: lead }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 4!acc
      bd: 1 2.5 3 3.5
  fill:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5
      t1: 3 3.5
      t2: 4
      t3: 4.5
      bd: 1 3 4.5
  # bass: straight eighths, one root per bar
  b_d:
    type: pitched
    bars: 1
    notes: "(D2:8)*8"
  b_g:
    type: pitched
    bars: 1
    notes: "(G1:8)*8"
  b_a:
    type: pitched
    bars: 1
    notes: "(A1:8)*8"
  b_b:
    type: pitched
    bars: 1
    notes: "(B1:8)*8"

sections:
  intro:
    bars: 4
    dynamic: f
    chords: "D | D | G | A"
    parts:
      dr:
        use: beat_verse
        replace:
          1: { hits: "hh: 1 2 3 4\nsd: 2 4\nbd: 1 3" }
          4: { use: fill }
        add: { 1: { hits: "cr: 1!acc" } }
      bs:
        notes: "(D2:8)*8 | (D2:8)*8 | (G1:8)*8 | (A1:8)*8"
      gt1:
        notes: "([D3 A3]:8)*8 | ([D3 A3]:8)*8 | ([G2 D3]:8)*8 | ([A2 E3]:8)*8"
      gt2:
        notes: "r:1 | r:1 | B4:8 B4:8 A4:8 G4:8 B4:4 D5:4 | E5:2~ E5:4!vib r:4"

  verse:
    bars: 8
    dynamic: mf
    chords: "D | D | G | A | D | Bm | G | A"
    parts:
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
      bs:
        notes: "(D2:8)*8 | (D2:8)*8 | (G1:8)*8 | (A1:8)*8 | (D2:8)*8 | (B1:8)*8 | (G1:8)*8 | (A1:8)*8"
      gt1:
        notes: >-
          ([D3 A3]:8!pm)*8 | ([D3 A3]:8!pm)*8 | ([G2 D3]:8!pm)*8 | ([A2 E3]:8!pm)*8 |
          ([D3 A3]:8!pm)*8 | ([B2 F#3]:8!pm)*8 | ([G2 D3]:8!pm)*8 | ([A2 E3]:8!pm)*8
      gt2:
        notes: >-
          r:2 F#4:8 F#4:8 G4:8 A4:8 | A4:4. F#4:8 D4:2 | B4:8 B4:8 A4:8 G4:8 B4:4 A4:4 | E4:2~ E4:4!vib r:4 |
          F#4:8 F#4:8 F#4:8 A4:8 D5:4 B4:4 | A4:4. F#4:8 D4:4 F#4:4 | G4:8 G4:8 B4:8 D5:8 B4:4. A4:8 | A4:2~ A4:4!vib r:4

  chorus:
    bars: 8
    dynamic: f
    chords: "D | A | Bm | G | D | A | G | A"
    parts:
      dr:
        use: beat_chorus
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" }, 5: { hits: "cr: 1!acc" } }
      bs:
        notes: "(D2:8)*8 | (A1:8)*8 | (B1:8)*8 | (G1:8)*8 | (D2:8)*8 | (A1:8)*8 | (G1:8)*8 | (A1:8)*8"
      gt1:
        notes: >-
          ([D3 A3]:8)*8 | ([A2 E3]:8)*8 | ([B2 F#3]:8)*8 | ([G2 D3]:8)*8 |
          ([D3 A3]:8)*8 | ([A2 E3]:8)*8 | ([G2 D3]:8)*8 | ([A2 E3]:8)*8
      gt2:
        notes: >-
          D5:4. D5:8 E5:4 F#5:4 | E5:4. C#5:8 A4:2 | D5:4. D5:8 F#5:4 D5:4 | B4:2~ B4:4!vib r:4 |
          D5:4. D5:8 E5:4 F#5:4 | A5:4. G5:8 F#5:4 E5:4 | D5:4 E5:4 D5:4 B4:4 | C#5:2~ C#5:4!vib r:4

  outro:
    bars: 4
    dynamic: ff
    chords: "D | G | A | D"
    parts:
      dr:
        hits: |
          hh: every 0.5 | every 0.5 | every 0.5 |
          sd: 2 4 | 2 4 | 2 4 |
          bd: 1 1.5 3 3.5 | 1 1.5 3 3.5 | 1 1.5 3 3.5 | 1!acc
          cr: 1!acc | | | 1!acc
      bs:
        notes: "(D2:8)*8 | (G1:8)*8 | (A1:8)*8 | D2:1"
      gt1:
        notes: "([D3 A3]:8)*8 | ([G2 D3]:8)*8 | ([A2 E3]:8)*8 | [D3 A3 D4]:1"
      gt2:
        notes: "D5:4. D5:8 E5:4 F#5:4 | B4:4. B4:8 D5:2 | E5:2 C#5:2 | D5:2~ D5:2!vib"

form: [intro, verse, chorus, verse, chorus, outro]

performance:
  seed: 11
  humanize: { timing_ms: 4, velocity: 0.04 }
  parts:
    dr:
      lanes:
        hh: { velocity: -0.05 }

mix:
  space: room
  gt1: { pan: -0.5 }
  gt2: { pan: 0.4, reverb: more }
