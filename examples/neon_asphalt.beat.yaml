beat: 0.1

meta:
  title: Neon Asphalt
  tempo: 128
  time: 4/4
  key: A minor (A major chorus)
  style: classic hard rock, instrumental

instruments:
  dr:   { type: drums }
  bs:   { type: bass }
  gtl:  { type: guitar, tone: crunch }   # rhythm, left
  gtr:  { type: guitar, tone: crunch }   # rhythm, right
  lead: { type: guitar, tone: lead }
  org:  { type: organ, model: { registration: rock } }

patterns:
  beat_verse:
    type: drums
    bars: 1
    hits: |
      hh: every 0.5
      sd: 2!acc 3.75!ghost 4!acc
      bd: 1 2.5 3
  beat_pre:
    type: drums
    bars: 1
    hits: |
      t3: every 0.5
      sd: 2!acc 4!acc
      bd: 1 1.5 3 3.5
  beat_chorus:
    type: drums
    bars: 1
    hits: |
      rd: every 0.5
      sd: 2!acc 4!acc
      bd: 1 2.5 3 3.5
  fill:
    type: drums
    bars: 1
    hits: |
      hh: 1 1.5 2 2.5
      sd: 2!acc 3 3.25
      t1: 3.5 3.75
      t2: 4 4.25
      t3: 4.5 4.75!acc
      bd: 1 3
  fill_build:
    type: drums
    bars: 1
    hits: |
      sd: 1 1.5 2 2.5 3 3.25 3.5 3.75 4!acc 4.25!acc 4.5!acc 4.75!acc
      bd: 1 2 3 4

  riff:
    type: pitched
    bars: 2
    notes: "A2:8!pm A2:8!pm [A2 E3 A3]:4 A2:8!pm A2:8!pm G2:8 A2:8 | [G2 D3 G3]:4 [G2 D3 G3]:8 [D3 A3 D4]:8~ [D3 A3 D4]:2"
  verse_end:
    type: pitched
    bars: 4
    notes: "([F2 C3 F3]:8!pm)*8 | ([G2 D3 G3]:8!pm)*8 | ([A2 E3 A3]:8!pm)*8 | [E2 B2 E3]:2 [E2 B2 E3]:8 [E2 B2 E3]:8 [E2 B2 E3]:4!acc"
  solo_end:
    type: pitched
    bars: 4
    notes: "([F2 C3 F3]:8)*8 | ([G2 D3 G3]:8)*8 | ([A2 E3 A3]:8)*8 | [E2 B2 E3 G#3 B3 E4]:1"
  bass_riff:
    type: pitched
    bars: 2
    notes: "A1:8 A1:8 A1:4 A1:8 A1:8 G1:8 A1:8 | G1:4 G1:8 D2:8~ D2:2"
  bass_verse_end:
    type: pitched
    bars: 4
    notes: "(F1:8)*8 | (G1:8)*8 | (A1:8)*8 | E1:2 E1:8 E1:8 E1:4!acc"

sections:
  intro:
    bars: 4
    chords: "A5 | G5 D5 | A5 | G5 D5"
    parts:
      gtl: { use: riff }
      gtr:
        use: riff
        replace: { 1-2: { notes: "r:1 | r:1" } }
      bs:
        use: bass_riff
        replace: { 1-2: { notes: "r:1 | r:1" } }
      dr:
        use: beat_verse
        replace:
          1-2: { hits: "hh: 1 2 3 4 | 1 2 3 4" }
          4: { use: fill }
        add: { 3: { hits: "cr: 1!acc" } }

  verse:
    bars: 8
    chords: "A5 | G5 D5 | A5 | G5 D5 | F5 | G5 | A5 | E5"
    parts:
      gtl:
        use: riff
        replace: { 5-8: { use: verse_end } }
      gtr:
        use: riff
        replace:
          1-4: { notes: "r:1 | r:1 | r:1 | r:1" }
          5-8: { use: verse_end }
      bs:
        use: bass_riff
        replace: { 5-8: { use: bass_verse_end } }
      dr:
        use: beat_verse
        replace: { 8: { use: fill } }
        add: { 1: { hits: "cr: 1!acc" } }

  verse2:
    extends: verse
    parts:
      gtr:
        use: riff
        replace: { 5-8: { use: verse_end } }
      org:
        dynamic: mp
        notes: >-
          [A3 E4]:1 | [G3 D4]:2 [A3 D4]:2 | [A3 E4]:1 | [G3 D4]:2 [A3 D4]:2 |
          [A3 C4 F4]:1 | [B3 D4 G4]:1 | [A3 C4 E4]:1 | [G#3 B3 E4]:1
      lead:
        notes: >-
          r:1 | r:1 | r:1 | r:2 E5:8 D5:8 C5:8 A4:8 |
          r:1 | r:1 | r:1 | r:2 B4:8 G#4:8 E4:4

  pre:
    bars: 4
    dynamic: f
    chords: "D | F | G | E"
    parts:
      gtl: { notes: "([D3 A3 D4]:8)*8 | ([F2 C3 F3]:8)*8 | ([G2 D3 G3]:8)*8 | [E2 B2 E3 G#3 B3 E4]:1" }
      gtr: { notes: "([D3 A3 D4]:8)*8 | ([F2 C3 F3]:8)*8 | ([G2 D3 G3]:8)*8 | [E2 B2 E3 G#3 B3 E4]:1" }
      bs: { notes: "(D2:8)*8 | (F1:8)*8 | (G1:8)*8 | E1:1" }
      org:
        notes: "[A3 D4 F#4]:1 | [A3 C4 F4]:1 | [B3 D4 G4]:1 | [G#3 B3 E4]:1"
      dr:
        use: beat_pre
        replace: { 4: { use: fill_build } }

  chorus:
    bars: 8
    dynamic: f
    chords: "A | E | F#m | D | A | E | D | E"
    parts:
      gtl:
        notes: >-
          [A2 E3 A3 C#4 E4]:4. [A2 E3 A3 C#4 E4]:8~ [A2 E3 A3 C#4 E4]:4 [A2 E3 A3 C#4 E4]:8 [A2 E3 A3 C#4 E4]:8 |
          [E2 B2 E3 G#3 B3 E4]:4. [E2 B2 E3 G#3 B3 E4]:8~ [E2 B2 E3 G#3 B3 E4]:4 [E2 B2 E3 G#3 B3 E4]:8 [E2 B2 E3 G#3 B3 E4]:8 |
          [F#2 C#3 F#3 A3 C#4 F#4]:4. [F#2 C#3 F#3 A3 C#4 F#4]:8~ [F#2 C#3 F#3 A3 C#4 F#4]:4 [F#2 C#3 F#3 A3 C#4 F#4]:8 [F#2 C#3 F#3 A3 C#4 F#4]:8 |
          [D3 A3 D4 F#4]:4. [D3 A3 D4 F#4]:8~ [D3 A3 D4 F#4]:4 [D3 A3 D4 F#4]:8 [D3 A3 D4 F#4]:8 |
          [A2 E3 A3 C#4 E4]:4. [A2 E3 A3 C#4 E4]:8~ [A2 E3 A3 C#4 E4]:4 [A2 E3 A3 C#4 E4]:8 [A2 E3 A3 C#4 E4]:8 |
          [E2 B2 E3 G#3 B3 E4]:4. [E2 B2 E3 G#3 B3 E4]:8~ [E2 B2 E3 G#3 B3 E4]:4 [E2 B2 E3 G#3 B3 E4]:8 [E2 B2 E3 G#3 B3 E4]:8 |
          [D3 A3 D4 F#4]:4. [D3 A3 D4 F#4]:8~ [D3 A3 D4 F#4]:4 [D3 A3 D4 F#4]:8 [D3 A3 D4 F#4]:8 |
          [E2 B2 E3 G#3 B3 E4]:2 [E2 B2 E3 G#3 B3 E4]:4 [E2 B2 E3 G#3 B3 E4]:4!acc
      gtr:
        notes: >-
          ([A2 E3 A3]:8)*8 | ([E2 B2 E3]:8)*8 | ([F#2 C#3 F#3]:8)*8 | ([D3 A3 D4]:8)*8 |
          ([A2 E3 A3]:8)*8 | ([E2 B2 E3]:8)*8 | ([D3 A3 D4]:8)*8 | ([E2 B2 E3]:8)*6 [E2 B2 E3]:4!acc
      lead:
        notes: >-
          C#5:4. B4:8 A4:4 E4:4 | B4:2. G#4:4 | A4:4 C#5:8 E5:8~ E5:2 | D5:4 C#5:8 B4:8 A4:2 |
          C#5:4. B4:8 A4:4 E5:4 | E5:4. D5:8 B4:2 | A4:4 B4:4 D5:4 F#5:4 | E5:2~ E5:4!vib r:4
      bs:
        notes: >-
          (A1:8)*8 | (E1:8)*8 | (F#1:8)*8 | (D2:8)*8 |
          (A1:8)*8 | (E1:8)*8 | (D2:8)*6 C#2:8 D2:8 | (E1:8)*6 G#1:8 B1:8
      org:
        leslie: fast
        notes: >-
          [A3 C#4 E4]:1 | [G#3 B3 E4]:1 | [A3 C#4 F#4]:1 | [A3 D4 F#4]:1 |
          [A3 C#4 E4]:1 | [G#3 B3 E4]:1 | [A3 D4 F#4]:1 | [G#3 B3 E4]:1
      dr:
        use: beat_chorus
        replace: { 8: { use: fill } }
        add:
          1: { hits: "cr: 1!acc" }
          5: { hits: "cr: 1!acc" }

  solo:
    bars: 16
    dynamic: f
    chords: >-
      A5 | G5 D5 | A5 | G5 D5 | F5 | G5 | A5 | E5 |
      A5 | G5 D5 | A5 | G5 D5 | F5 | G5 | A5 | E5
    parts:
      gtl:
        use: riff
        replace:
          5-8: { use: verse_end }
          13-16: { use: solo_end }
      gtr:
        use: riff
        replace:
          5-8: { use: verse_end }
          13-16: { use: solo_end }
      bs:
        use: bass_riff
        replace:
          5-8: { use: bass_verse_end }
          13-16: { notes: "(F1:8)*8 | (G1:8)*8 | (A1:8)*8 | E1:1" }
      lead:
        notes: >-
          r:8 A4:8 C5:8 D5:8 E5:4 D5:8!p C5:8!p | D5:4. C5:8 A4:4 G4:4 |
          A4:8 C5:8 A4:8 C5:8 D5:8 D#5:8 E5:4 | G5:4 E5:8 D5:8 E5:2!vib |
          F5:4. E5:8 C5:4 A4:4 | G5:4. F5:8 D5:4 B4:4 |
          (A5:16 G5:16 E5:16 D5:16)*2 C5:8 A4:8 C5:8 D5:8 | E5:4 D5:8 B4:8 G#4:2 |
          E5:8 G5:8 A5:4~ A5:4 G5:8 E5:8 | G5:4 D5:8 G5:8 A5:4 G5:8 E5:8 |
          (A4:8t C5:8t D5:8t)*2 (E5:8t G5:8t A5:8t)*2 | C6:4 A5:8 G5:8 A5:4. G5:8 |
          A5:8 C6:8 A5:8 F5:8 A5:8 C6:8 A5:8 F5:8 | B5:8 D6:8 B5:8 G5:8 B5:8 D6:8 B5:8 G5:8 |
          (A5:16 G5:16 E5:16 D5:16)*3 C5:8 A4:8 | E5:2~ E5:4!vib G#4:8 B4:8
      org:
        leslie: fast
        notes: >-
          [A3 E4]:1 | [G3 D4]:2 [A3 D4]:2 | [A3 E4]:1 | [G3 D4]:2 [A3 D4]:2 |
          [A3 C4 F4]:1 | [B3 D4 G4]:1 | [A3 C4 E4]:1 | [G#3 B3 E4]:1 |
          [A3 E4 A4]:1 | [G3 D4 G4]:2 [A3 D4 A4]:2 | [A3 E4 A4]:1 | [G3 D4 G4]:2 [A3 D4 A4]:2 |
          [A3 C4 F4]:1 | [B3 D4 G4]:1 | [A3 C4 E4]:1 | [G#3 B3 E4]:1
      dr:
        use: beat_chorus
        replace:
          8: { use: fill }
          16: { use: fill_build }
        add:
          1: { hits: "cr: 1!acc" }
          9: { hits: "cr: 1!acc" }
          13: { hits: "cr: 1!acc" }

  chorus_last:
    extends: chorus
    dynamic: ff

  outro:
    bars: 4
    dynamic: f
    chords: "A5 | G5 D5 | A | A"
    parts:
      gtl: { notes: "A2:8!pm A2:8!pm [A2 E3 A3]:4 A2:8!pm A2:8!pm G2:8 A2:8 | [G2 D3 G3]:4 [G2 D3 G3]:8 [D3 A3 D4]:8~ [D3 A3 D4]:2 | [A2 E3 A3 C#4 E4]:1~ | [A2 E3 A3 C#4 E4]:1" }
      gtr: { notes: "A2:8!pm A2:8!pm [A2 E3 A3]:4 A2:8!pm A2:8!pm G2:8 A2:8 | [G2 D3 G3]:4 [G2 D3 G3]:8 [D3 A3 D4]:8~ [D3 A3 D4]:2 | [A2 E3 A3]:1~ | [A2 E3 A3]:1" }
      bs: { notes: "A1:8 A1:8 A1:4 A1:8 A1:8 G1:8 A1:8 | G1:4 G1:8 D2:8~ D2:2 | A1:1~ | A1:1" }
      lead: { notes: "r:1 | r:1 | A4:1~ | A4:1!vib" }
      org: { notes: "[A3 E4]:1 | [G3 D4]:2 [A3 D4]:2 | [A3 C#4 E4]:1~ | [A3 C#4 E4]:1" }
      dr:
        hits: |
          hh: every 0.5 | 1 1.5 2 2.5 | |
          sd: 2!acc 4!acc | 2!acc 3 3.25 | |
          t1: | 3.5 3.75 | |
          t2: | 4 4.25 | |
          t3: | 4.5 4.75!acc | |
          cr: 1!acc | | 1!acc |
          bd: 1 2.5 3 | 1 3 | 1!acc |

form: [intro, verse, pre, chorus, verse2, pre, chorus, solo, chorus_last, outro]

performance:
  seed: 11
  humanize: { timing_ms: 5, velocity: 0.04 }
  parts:
    dr:
      lanes:
        sd: { offset_ms: 5 }
        hh: { velocity: -0.05 }
    bs: { offset_ms: 3 }
    gtr: { strum_ms: 10 }

mix:
  space: studio
  dr:   { gain_db: 0 }
  bs:   { gain_db: -1 }
  gtl:  { gain_db: -2, pan: -0.7 }
  gtr:  { gain_db: -2, pan: 0.7 }
  lead: { gain_db: -1, pan: 0.1, reverb: more }
  org:  { gain_db: -6, pan: -0.15 }
  master: { style: rock, loudness: -14 }
