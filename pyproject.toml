[project]
name = "beat"
version = "0.1.0"
description = "LLM-composed rock band with code-synthesized instruments"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3",
    "numba>=0.68.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[project.scripts]
beat = "beat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
